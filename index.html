<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FF2D78">
<title>Laila's Math Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap">
<style>
/* Layout: iOS-style single column. Translucent top bar, big titles, grouped cards, floating tab bar.
   Palette: pink pop by day, deep-space purple by night. */
:root{
  --bg:#FFF1F6; --bg2:#FFD9E8; --card:#FFFFFF; --card2:#FFF6FA; --ink:#2A1630; --mute:#80628B; --line:rgba(120,40,100,.13);
  --accent:#FF2D78; --accent-ink:#FFFFFF; --accent-soft:#FFE0EC; --lilac:#8E5CFF;
  --good:#12875B; --good-bg:#DDF6EA; --warn:#B85200; --warn-bg:#FFEBD6; --gold:#FFB400; --spark:rgba(255,120,170,.55);
  --shadow:0 8px 28px rgba(255,45,120,.12),0 1px 3px rgba(80,20,70,.08); --bar:rgba(255,246,250,.8);
  --f-ui:-apple-system,BlinkMacSystemFont,'SF Pro Rounded','SF Pro Display','Inter',system-ui,'Segoe UI',sans-serif;
  --f-num:'SF Mono','JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D0A1F; --bg2:#2A1250; --card:#1A1535; --card2:#241C47; --ink:#F8EFFF; --mute:#B0A0CC; --line:rgba(255,255,255,.11);
  --accent:#FF5C9A; --accent-ink:#2A0A1C; --accent-soft:#40203F; --lilac:#AB8DFF;
  --good:#4FD39B; --good-bg:#10382B; --warn:#FFAA5C; --warn-bg:#3F2610; --gold:#FFD24D; --spark:rgba(255,255,255,.7);
  --shadow:0 10px 30px rgba(0,0,0,.4); --bar:rgba(18,12,42,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0A1F; --bg2:#2A1250; --card:#1A1535; --card2:#241C47; --ink:#F8EFFF; --mute:#B0A0CC; --line:rgba(255,255,255,.11);
  --accent:#FF5C9A; --accent-ink:#2A0A1C; --accent-soft:#40203F; --lilac:#AB8DFF;
  --good:#4FD39B; --good-bg:#10382B; --warn:#FFAA5C; --warn-bg:#3F2610; --gold:#FFD24D; --spark:rgba(255,255,255,.7);
  --shadow:0 10px 30px rgba(0,0,0,.4); --bar:rgba(18,12,42,.8); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background-color:var(--bg);
  background-image:radial-gradient(120% 60% at 15% 0%,var(--bg2),transparent 60%),radial-gradient(1.6px 1.6px at 18px 24px,var(--spark),transparent),radial-gradient(1.1px 1.1px at 66px 72px,var(--spark),transparent);
  background-size:auto,96px 96px,96px 96px;background-attachment:fixed,scroll,scroll;
  color:var(--ink);font:500 17px/1.45 var(--f-ui);padding-inline:16px;padding-block:0 120px;min-height:100vh}
#app{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.02em;text-wrap:balance;line-height:1.12}
h1{font-size:2.1rem} h2{font-size:1.5rem} h3{font-size:1.1rem}
p{margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* top bar */
.navbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-inline:-16px;padding:12px 16px 10px;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line)}
.navbar .mid{font-weight:800;font-size:1.02rem;text-align:center;flex:1;min-width:0}
.back{display:inline-flex;align-items:center;gap:2px;color:var(--accent);font-weight:700;min-height:44px;padding-right:8px}
.back svg{width:22px;height:22px}
.largehead{padding-top:18px;display:flex;flex-direction:column;gap:2px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 12px;font-weight:800;font-size:.82rem}
.pill.plain{background:var(--card2);color:var(--mute);border:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good)}
.dot.off{background:var(--gold)}

/* cards and buttons */
.card{background:var(--card);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.btn{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:13px 26px;font-weight:800;font-size:1.04rem;min-height:50px}
.btn.tint{background:var(--accent-soft);color:var(--accent)}
.btn.quiet{background:var(--card2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
@media(prefers-reduced-motion:no-preference){.btn,.choice,.mode,.tab,.swatch,.item{transition:transform .12s ease,box-shadow .12s}.btn:active,.choice:active,.mode:active,.item:active{transform:scale(.97)}}

/* home */
.hero{background:linear-gradient(140deg,var(--accent),var(--lilac));color:#fff;border-radius:28px;padding:20px;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:center;box-shadow:var(--shadow)}
.hero .who{display:flex;flex-direction:column;gap:2px;min-width:0}
.hero .who h2{color:#fff}
.hero .who span{opacity:.9;font-weight:600;font-size:.95rem}
.hero .av{width:104px;height:112px;background:rgba(255,255,255,.22);border-radius:26px;display:grid;place-items:center;overflow:hidden}
.stats{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.stat{background:rgba(255,255,255,.2);border-radius:16px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:1.5rem;font-weight:800;line-height:1.1}
.stat span{font-weight:700;font-size:.78rem;opacity:.92}
.journey{grid-column:1/-1;background:rgba(10,4,30,.38);border-radius:18px;padding:12px 12px 8px;margin-top:4px}
.journey svg{width:100%;display:block}
.journey text{fill:#fff;font-family:var(--f-ui);font-size:9.5px;font-weight:700}
.journey p{font-size:.9rem;font-weight:700;margin-top:2px}
.sect{font-weight:800;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);padding:6px 6px 0}
.modes{display:flex;flex-direction:column;gap:10px}
.mode{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;text-align:left;background:var(--card);border-radius:22px;padding:14px 16px;box-shadow:var(--shadow);min-height:84px}
.mode .ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.mode .ic svg{width:30px;height:30px}
.mode.lead .ic{background:var(--accent);color:var(--accent-ink)}
.mode h3{font-size:1.12rem}
.mode span.d{color:var(--mute);font-size:.92rem;display:block}
.mode .go{color:var(--mute);width:20px;height:20px}
.spark{background:var(--card2);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:4px;box-shadow:inset 0 0 0 1px var(--line)}
.spark b{color:var(--accent);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em}

/* bracelet */
.bracelet{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:6px 0;position:relative}
.bead{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:1.15rem;color:#fff;background:var(--accent);box-shadow:inset 0 -4px 0 rgba(0,0,0,.14),0 2px 6px rgba(255,45,120,.3)}
.bead:nth-child(3n+2){background:var(--lilac)}
.bead:nth-child(3n){background:#FF9A3C}
.bead.off{background:var(--card2);color:var(--mute);box-shadow:inset 0 0 0 2px var(--line)}
.dl{display:flex;flex-direction:column;gap:8px;font-size:.92rem}
.dl div{display:flex;gap:10px;align-items:baseline}
.dl b{min-width:112px}
.dl .off{opacity:.55}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-top:1px solid var(--line)}
.tabbar>div{display:flex;gap:6px;width:100%;max-width:720px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mute);font-weight:700;font-size:.72rem;min-height:52px;border-radius:14px}
.tab svg{width:26px;height:26px}
.tab.on{color:var(--accent)}

/* run */
.track{position:relative;height:48px;margin-top:2px}
.track .lane{position:absolute;left:0;right:0;top:34px;height:8px;border-radius:99px;background:var(--accent-soft);overflow:hidden}
.track .lane i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--lilac));border-radius:99px;transition:width .4s}
.track .kart{position:absolute;top:0;width:56px;transition:left .4s}
.track .flag{position:absolute;right:0;top:6px;width:22px;height:30px}
.score{display:flex;gap:8px;align-items:center;font-weight:800}
.qtext{font-family:var(--f-num);font-weight:700;font-size:clamp(1.9rem,8vw,2.8rem);line-height:1.25;overflow-wrap:anywhere}
.qtext.word{font-family:var(--f-ui);font-weight:700;font-size:1.3rem;line-height:1.45}
.stack{display:inline-grid;align-self:flex-start;font-family:var(--f-num);font-weight:700;font-size:clamp(2.1rem,9vw,3.1rem);line-height:1.3;border-bottom:4px solid var(--ink);padding:0 4px 4px;min-width:5ch}
.stack>div{display:flex;justify-content:space-between;gap:1.2ch}
.stack>div:first-child{justify-content:flex-end}
.pill.timer{background:var(--accent-soft);color:var(--accent);font-size:.95rem;min-width:64px;justify-content:center}
.pill.timer.warn{background:var(--warn-bg);color:var(--warn)}
.tbar{height:6px;border-radius:99px;background:var(--accent-soft);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--accent);transition:width 1s linear}
.tbar i.warn{background:var(--warn)}
.paper{background:var(--warn-bg);color:var(--warn);border-radius:16px;padding:10px 14px;font-weight:700;font-size:.93rem}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.choice{background:var(--card2);box-shadow:inset 0 0 0 2px var(--line);border-radius:20px;padding:16px;font-family:var(--f-num);font-weight:700;font-size:1.65rem;min-height:70px}
.choice:hover:not(:disabled){box-shadow:inset 0 0 0 3px var(--accent)}
.choice.sel{background:var(--accent-soft);box-shadow:inset 0 0 0 3px var(--accent)}
.choice.bad{background:var(--warn-bg);box-shadow:inset 0 0 0 3px var(--warn);opacity:.7}
.choice.ok{background:var(--good-bg);box-shadow:inset 0 0 0 3px var(--good)}
input.ans{font-family:var(--f-num);font-weight:700;font-size:2rem;width:100%;max-width:280px;padding:10px 16px;border:0;border-radius:18px;background:var(--card2);box-shadow:inset 0 0 0 2px var(--line);color:var(--ink)}
.fb{border-radius:18px;padding:12px 16px;font-weight:800}
.fb.good{background:var(--good-bg);color:var(--good)}
.fb.try{background:var(--warn-bg);color:var(--warn)}
.steps{background:var(--card2);border-radius:18px;padding:14px 16px 14px 36px;margin:0;display:flex;flex-direction:column;gap:6px;box-shadow:inset 0 0 0 1px var(--line)}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav button{width:42px;height:42px;border-radius:12px;background:var(--card2);box-shadow:inset 0 0 0 2px var(--line);font-family:var(--f-num);font-weight:700}
.nav button.done{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.nav button.cur{background:var(--accent);color:var(--accent-ink)}
.bigscore{font-family:var(--f-num);font-weight:800;font-size:3.2rem;line-height:1}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;height:120px}
.podium div{width:84px;border-radius:14px 14px 0 0;background:var(--accent-soft);color:var(--mute);text-align:center;font-weight:800;padding-top:8px}
.podium .me{background:linear-gradient(var(--accent),var(--lilac));color:#fff}
details{background:var(--card2);border-radius:18px;padding:12px 16px;box-shadow:inset 0 0 0 1px var(--line)}
summary{cursor:pointer;font-weight:800}

/* closet */
.avbig{display:grid;place-items:center;background:linear-gradient(160deg,var(--accent-soft),var(--card2));border-radius:28px;padding:10px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:44px;height:44px;border-radius:50%;box-shadow:inset 0 0 0 3px var(--card),0 0 0 1px var(--line)}
.swatch.on{box-shadow:inset 0 0 0 3px var(--card),0 0 0 3px var(--accent)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{background:var(--card2);border-radius:18px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px;box-shadow:inset 0 0 0 2px var(--line);min-height:76px}
.item.on{box-shadow:inset 0 0 0 3px var(--accent);background:var(--accent-soft)}
.item.lock{opacity:.55}
.item small{color:var(--mute);font-weight:700}

/* parent */
.seg{display:flex;background:var(--card2);border-radius:14px;padding:3px;box-shadow:inset 0 0 0 1px var(--line)}
.seg button{flex:1;padding:9px 6px;border-radius:11px;font-weight:700;font-size:.92rem;min-height:40px;color:var(--mute)}
.seg.wrap{flex-wrap:wrap}.seg.wrap button{flex:1 1 30%}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.bar{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) 52px;gap:10px;align-items:center;font-size:.92rem}
.bar .track2{background:var(--accent-soft);border-radius:8px;height:14px;overflow:hidden}
.bar .fill{display:block;height:100%;background:var(--accent);border-radius:8px}
.bar .fill.low{background:var(--warn)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-size:.76rem;text-transform:uppercase;letter-spacing:.06em}
.chart text{fill:var(--mute);font-family:var(--f-ui);font-size:11px;font-weight:700}
select,input.txt{font:inherit;padding:8px 14px;border:0;border-radius:14px;background:var(--card2);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line);min-height:44px}
@media(max-width:480px){.card{padding:16px}.bar{grid-template-columns:1fr 1fr 44px}.hero{grid-template-columns:96px 1fr}.hero .av{width:96px;height:104px}}
</style>

<div id="app"></div>
<script>
"use strict";
/* ---------- helpers ---------- */
const $app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[ri(0,a.length-1)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const dg=n=>[n%10,Math.floor(n/10)%10,Math.floor(n/100)];
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const dayKey=ts=>new Date(ts).toLocaleDateString('en-CA');
const fmtDate=ts=>new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric'});

/* ---------- problem types ---------- */
const TYPES={
  sub2:{label:'Regroup tens (2-digit)',op:'-',gen(){for(;;){const a=ri(21,99),b=ri(11,a-1);if(dg(a)[0]<dg(b)[0])return[a,b]}}},
  sub3o:{label:'Regroup ones (3-digit)',op:'-',gen(){for(;;){const a=ri(120,999),b=ri(100,a-1),x=dg(a),y=dg(b);if(x[0]<y[0]&&x[1]>=1&&x[1]-1>=y[1]&&x[2]>=y[2])return[a,b]}}},
  sub3t:{label:'Regroup tens (3-digit)',op:'-',gen(){for(;;){const a=ri(150,999),b=ri(100,a-1),x=dg(a),y=dg(b);if(x[0]>=y[0]&&x[1]<y[1]&&x[2]-1>=y[2])return[a,b]}}},
  sub3b:{label:'Regroup ones and tens',op:'-',gen(){for(;;){const a=ri(200,999),b=ri(100,a-1),x=dg(a),y=dg(b);if(x[0]<y[0]&&x[1]>=1&&x[1]-1<y[1]&&x[2]-1>=y[2])return[a,b]}}},
  subz:{label:'Subtract across zeros',op:'-',gen(){for(;;){const a=ri(2,9)*100+pick([0,0,ri(1,6)]),b=ri(100,a-1),x=dg(a),y=dg(b);if(x[1]===0&&x[0]<y[0]&&x[2]-1>=y[2])return[a,b]}}},
  sub32:{label:'3-digit minus 2-digit',op:'-',gen(){for(;;){const a=ri(101,999),b=ri(11,99),x=dg(a),y=dg(b);if(a>b&&(x[0]<y[0]||x[1]<y[1]))return[a,b]}}},
  add3:{label:'Add with regrouping',op:'+',gen(){for(;;){const a=ri(120,899),b=ri(100,999-a),x=dg(a),y=dg(b);if(x[0]+y[0]>=10||x[1]+y[1]>=10)return[a,b]}}},
  word:{label:'Word problems',op:'?',gen(){return[0,0]}},
  miss:{label:'Find the missing number',op:'?',gen(){return[0,0]}}
};
const TYPE_KEYS=Object.keys(TYPES);
const NAMES=['Maya','Eli','Nora','Sam','Ava','Leo','Zoe','Ben'];
const SUBW=[
  (a,b,n)=>`${n} collected ${a} shells at the beach and gave ${b} shells to a friend. How many shells does ${n} have now?`,
  (a,b)=>`There were ${a} books on the library shelves. Students borrowed ${b} of them. How many books are left on the shelves?`,
  (a,b)=>`A farm stand had ${a} apples. It sold ${b} apples today. How many apples are left?`,
  (a,b,n)=>`${n} needs ${a} points to win a game and has ${b} points so far. How many more points does ${n} need?`
];
const ADDW=[
  (a,b,n)=>`${n} read ${a} pages last week and ${b} pages this week. How many pages did ${n} read in all?`,
  (a,b)=>`A bakery made ${a} muffins in the morning and ${b} muffins in the afternoon. How many muffins did it make?`,
  (a,b)=>`The zoo had ${a} visitors on Saturday and ${b} visitors on Sunday. How many visitors came in all?`
];
const smallerBigger=q=>{const x=dg(q.a),y=dg(q.b);return[0,1,2].reduce((s,i)=>s+Math.abs(x[i]-y[i])*10**i,0)};
const forgotReduce=q=>{const x=dg(q.a),y=dg(q.b);return[0,1,2].reduce((s,i)=>s+(x[i]+(x[i]<y[i]?10:0)-y[i])*10**i,0)};
const noCarry=q=>{const x=dg(q.a),y=dg(q.b);return[0,1,2].reduce((s,i)=>s+((x[i]+y[i])%10)*10**i,0)};
function makeQ(type,fmt){
  const SUBK=['sub2','sub3o','sub3t','sub3b','subz','sub32'];
  let t=type,form=null,a,b;
  if(type==='word')t=pick([...SUBK,'add3','add3']);
  if(type==='miss'){form=pick(['addend','minuend','start']);t=form==='start'?'add3':pick(SUBK)}
  const op=TYPES[t].op;
  [a,b]=TYPES[t].gen();
  const ans=op==='-'?a-b:a+b;
  const n=pick(NAMES);
  let text;
  if(type==='word')text=(op==='-'?pick(SUBW):pick(ADDW))(a,b,n);
  else if(type==='miss')text=form==='addend'?`${b} + ? = ${a}`:form==='minuend'?`${a} − ? = ${b}`:`? − ${b} = ${a}`;
  else text=`${a} ${op==='-'?'−':'+'} ${b} = ?`;
  const q={type,kind:type==='word'?t:type,op,a,b,ans,text,fmt,form};
  const err=(op==='-'?[smallerBigger(q),forgotReduce(q)]:[noCarry(q)]);
  const pool=[...err,ans+10,ans-10,ans+1,ans-1,ans+100,ans-100].filter(v=>v>=0&&v<=1000&&v!==ans);
  const ds=[...new Set(pool)].slice(0,3);
  q.choices=shuffle([ans,...ds]);
  return q;
}
function classify(q,g){
  const v=Number(g);
  if(!Number.isFinite(v))return'other';
  if(q.op==='-'){const sb=smallerBigger(q),fr=forgotReduce(q);if(v===sb&&v===fr)return'regroup';if(v===sb)return'smaller';if(v===fr)return'reduce'}
  else if(v===noCarry(q))return'carry';
  if([1,10,100].includes(Math.abs(v-q.ans)))return'slip';
  return'other';
}
const ERR_LABEL={regroup:'Regrouping step went wrong (smaller-from-bigger or forgot to take 1 away)',smaller:'Subtracted the smaller digit from the bigger one',reduce:'Regrouped, but forgot to take 1 away from the next place',carry:'Forgot to carry when adding',slip:'Off by one fact (1, 10 or 100 away)',blank:'Left blank',other:'Other mistakes'};
const PLACE=['ones','tens','hundreds'],ONE=['one','ten','hundred'];
function steps(q){
  const s=coreSteps(q);
  if(!q.form)return s;
  const intro=q.form==='start'?`Think: ? − ${q.b} = ${q.a}, so add: ${q.a} + ${q.b}.`:q.form==='addend'?`Think: ${q.b} + ? = ${q.a}, so subtract: ${q.a} − ${q.b}.`:`Think: ${q.a} − ? = ${q.b}, so subtract: ${q.a} − ${q.b}.`;
  return[intro,...s];
}
function coreSteps(q){
  const t=dg(q.a),y=dg(q.b),out=[],nd=String(q.a).length;
  if(q.op==='-'){
    for(let i=0;i<nd;i++){
      const P=PLACE[i][0].toUpperCase()+PLACE[i].slice(1);
      if(t[i]<y[i]){
        let j=i+1;while(j<3&&t[j]===0)j++;
        const before=t[i];
        let s=`${P}: ${before} is smaller than ${y[i]}, so regroup. `;
        if(j>i+1){
          const zs=[];for(let k=i+1;k<j;k++)zs.push(PLACE[k]);
          s+=`The ${zs.join(' and ')} ${zs.length>1?'are':'is'} 0, so take 1 ${ONE[j]} from the ${PLACE[j]} place (${t[j]} → ${t[j]-1}). The zero${zs.length>1?'s turn':' turns'} into 9${zs.length>1?'s':''} and the ${PLACE[i]} get 10 more. `;
          t[j]--;for(let k=i+1;k<j;k++)t[k]=9;
        }else{
          s+=`Take 1 ${ONE[j]} from the ${PLACE[j]} place (${t[j]} → ${t[j]-1}) and add 10 to the ${PLACE[i]}. `;
          t[j]--;
        }
        t[i]+=10;
        s+=`Now ${t[i]} − ${y[i]} = ${t[i]-y[i]}.`;
        out.push(s);
      }else out.push(`${P}: ${t[i]} − ${y[i]} = ${t[i]-y[i]}.`);
    }
    out.push(`So ${q.a} − ${q.b} = ${q.ans}.`);
  }else{
    let c=0;
    for(let i=0;i<nd;i++){
      const P=PLACE[i][0].toUpperCase()+PLACE[i].slice(1),s=t[i]+y[i]+c;
      out.push(`${P}: ${t[i]} + ${y[i]}${c?' + 1 carried':''} = ${s}.`+(s>=10?` Write ${s%10} and carry 1 ${ONE[i+1]||'thousand'}.`:''));
      c=s>=10?1:0;
    }
    if(c)out.push('Write the carried 1 in the thousands place.');
    out.push(`So ${q.a} + ${q.b} = ${q.ans}.`);
  }
  return out;
}

function stats(){

function typeAcc(items,limit){

  const per={};

    const ks=new Set([i.t]);if(i.k&&i.k!=='word')ks.add(i.k);

function planTypes(mode,n){
  if(mode==='smart'){
    const acc=typeAcc(stats().items,20);
    const PRIOR={sub2:3,sub3o:3,sub3t:3,sub3b:3,subz:3,sub32:3,add3:1,word:1.5,miss:1.5};
    const w=TYPE_KEYS.map(k=>{const a=acc[k];return a.n<3?(PRIOR[k]||2):0.5+3*(1-a.c/a.n)});
    const out=[];
    for(let i=0;i<n;i++){let r=Math.random()*w.reduce((x,y)=>x+y,0),k=0;while(r>w[k]&&k<w.length-1){r-=w[k];k++}out.push(TYPE_KEYS[k])}
    return out;
  }
  const base=['sub2','sub3o','sub3t','sub3b','subz','sub32','add3','word','miss','sub3b','word','sub3t'];
  let out=shuffle(base);
  while(out.length<n)out=out.concat(shuffle(base));
  return mode==='exam'?out.slice(0,n):shuffle(base).slice(0,n);
}
function start(mode){
  const n=mode==='exam'?Number(S.settings.examLen)||12:10;
  const types=planTypes(mode,n);
  const fmts=shuffle(types.map((_,i)=>i%2?'mc':'type'));

  run={mode,qs,i:0,t0:Date.now(),answers:qs.map(()=>''),review:false,used:qs.map(()=>0),tickAt:Date.now(),started:mode!=='exam'||!timerOn(),
    st:qs.map(()=>({tries:0,hint:false,done:false,ok:false,wrong:[],err:null,msg:null,given:''}))};
  S.view='run';render();
}

  if(!run)return;

  if(run.mode!=='exam'||!timerOn()||S.view!=='run'||run.review||!run.started)return;
  const i=run.i;if(run.used[i]>=EXAM_SECS*1000)return;
  run.used[i]=Math.min(EXAM_SECS*1000,run.used[i]+d);
  const l=leftSecs(run),el=document.getElementById('timer'),bar=document.getElementById('tbar');
  if(el){el.classList.toggle('warn',l<=30);el.innerHTML=l===0?"Time's up":'<span class="num">'+fmtT(l)+'</span>'}
  if(bar){bar.classList.toggle('warn',l<=30);bar.style.width=Math.round(100*l/EXAM_SECS)+'%'}
  if(l===0){render();setTimeout(()=>{if(run&&run.i===i&&!run.review&&S.view==='run')act('next')},1500)}
},1000);

function answerArea(q,st,exam,val,locked){
  if(q.fmt==='mc'){
    return`<div class="choices">${q.choices.map(c=>{
      let cls='choice';
      if(exam){if(String(c)===val)cls+=' sel'}

      const dis=(exam?locked:(st.done||st.wrong.includes(String(c))))?'disabled':'';
      return`<button class="${cls}" data-act="pick" data-v="${c}" ${dis}>${c}</button>`}).join('')}</div>`;
  }
  const dis=(exam?locked:st.done)?'disabled':'';
  return`<div class="row"><input class="ans" id="ans" type="text" inputmode="numeric" autocomplete="off" aria-label="Your answer" value="${esc(val)}" ${dis}></div>`;

function chart(){
  const pts=S.sessions.slice(0,30).reverse();
  if(pts.length<2)return`<p class="mute">The chart appears after two sessions.</p>`;
  const W=640,H=230,L=34,R=14,T=14,B=30,x=i=>L+(W-L-R)*(i/(pts.length-1)),y=p=>T+(H-T-B)*(1-p/100);
  let g='';
  [0,25,50,75,100].forEach(v=>g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`);
  g+=`<line x1="${L}" x2="${W-R}" y1="${y(80)}" y2="${y(80)}" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${W-R}" y="${y(80)-5}" text-anchor="end" style="fill:var(--good)">80% goal</text>`;
  const path=pts.map((s,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(pct(s)).toFixed(1)}`).join(' ');
  g+=`<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>`;
  pts.forEach((s,i)=>{const e=s.mode==='exam';g+=`<circle cx="${x(i).toFixed(1)}" cy="${y(pct(s)).toFixed(1)}" r="${e?6:4.5}" fill="${e?'var(--accent)':'var(--card)'}" stroke="var(--accent)" stroke-width="2.5"/>`});
  g+=`<text x="${L}" y="${H-8}">${fmtDate(pts[0].ts)}</text><text x="${W-R}" y="${H-8}" text-anchor="end">${fmtDate(pts[pts.length-1].ts)}</text>`;
  return`<div class="scroll"><svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Score history chart" style="min-width:420px">${g}</svg></div><p class="mute">Filled dots are practice exams. Hollow dots are practice sessions.</p>`;
}
function progressTab(){
  const st=stats();
  if(!S.sessions.length)return`<section class="card"><h3>No sessions yet</h3><p class="mute">Once Laila finishes a session, her scores, mistake patterns and practice days show up here for both homes.</p></section>`;
  const acc=typeAcc(st.items,40);
  const errs={};st.items.filter(i=>i.err).forEach(i=>errs[i.err]=(errs[i.err]||0)+1);
  const errRows=Object.entries(errs).sort((a,b)=>b[1]-a[1]);
  const maxE=errRows.length?errRows[0][1]:1;
  const weak=TYPE_KEYS.filter(k=>acc[k].n>=3).sort((a,b)=>acc[a].c/acc[a].n-acc[b].c/acc[b].n)[0];
  const insight=weak&&acc[weak].c/acc[weak].n<0.85?`Needs the most work: ${TYPES[weak].label.toLowerCase()} (${Math.round(100*acc[weak].c/acc[weak].n)}% right).`:'No clear weak spot yet. Keep practicing.';
  return`<section class="card"><h3>Score history</h3>${chart()}</section>
  <section class="card"><h3>Accuracy by skill</h3><p><b>${esc(insight)}</b></p>
  <div class="bar"><span>Right with no hint</span><span class="track2"><span class="fill" style="width:${Math.round(100*st.items.filter(i=>i.ok&&!i.h).length/Math.max(1,st.items.length))}%"></span></span><span class="num">${Math.round(100*st.items.filter(i=>i.ok&&!i.h).length/Math.max(1,st.items.length))}%</span></div>
  ${TYPE_KEYS.map(k=>{const a=acc[k],p=a.n?Math.round(100*a.c/a.n):null;return`<div class="bar"><span>${TYPES[k].label}</span><span class="track2"><span class="fill ${p!==null&&p<70?'low':''}" style="width:${p||0}%"></span></span><span class="num">${p===null?'–':p+'%'}</span></div>`}).join('')}</section>
  <section class="card"><h3>Mistake patterns</h3>${errRows.length?errRows.map(([k,n])=>`<div class="bar"><span>${ERR_LABEL[k]||k}</span><span class="track2"><span class="fill low" style="width:${Math.round(100*n/maxE)}%"></span></span><span class="num">${n}</span></div>`).join(''):'<p class="mute">No mistakes recorded yet.</p>'}

}

let lastView=null;

  let h;
  switch(S.view){
    case'run':h=runView();break;
    case'results':h=resultsView();break;
    case'parent':h=parentView();break;
    case'closet':h=closetView();break;
    default:h=homeView();
  }
  $app.innerHTML=h;
  if(lastView!==S.view){window.scrollTo(0,0);lastView=S.view}
  const a=document.getElementById('ans');
  if(a&&!a.disabled)a.focus({preventScroll:true});
  const p=document.getElementById('pin');if(p)p.focus({preventScroll:true});
}
function finish(){
  const exam=run.mode==='exam',before=stats().stars;
  const items=run.qs.map((q,i)=>{
    const st=run.st[i];
    if(exam){
      const g=run.answers[i],ok=g!==''&&Number(g)===q.ans;
      return{t:q.type,k:q.kind,ok,to:timerOn()&&run.used[i]>=EXAM_SECS*1000?1:0,err:ok?null:g===''?'blank':classify(q,g),given:g};
    }
    return{t:q.type,k:q.kind,ok:st.ok,h:st.helped?1:0,err:st.err||null,given:st.given};
  });
  const correct=items.filter(i=>i.ok).length;
  const sess={ts:Date.now(),mode:run.mode,home:S.home||'',correct,total:items.length,secs:Math.round((Date.now()-run.t0)/1000),stars:exam?correct*2+5:correct+3,items:items.map(i=>({t:i.t,k:i.k,ok:i.ok,h:i.h||0,to:i.to||0,err:i.err}))};
  saveSession(sess);
  const now=before+sess.stars;
  const unlocked=ITEMS.filter(it=>it.at>before&&it.at<=now).map(it=>it.name);
  const stop=STOPS.filter(p=>p.at>0&&p.at>before&&p.at<=now).map(p=>p.n);
  run.result=Object.assign({},sess,{items,unlocked,stop});S.view='results';render();
}
function guidedSubmit(val){
  const q=run.qs[run.i],st=run.st[run.i];
  if(st.done)return;
  val=String(val).trim();if(val==='')return;
  st.tries++;st.given=val;
  if(Number(val)===q.ans){st.done=true;st.ok=true;st.helped=st.tries>1||st.hint;st.msg='right';st.cheer=pick(CHEERS)}
  else{
    if(!st.err)st.err=classify(q,val);
    st.wrong.push(val);st.hint=true;
    if(st.tries>=2){st.done=true;st.ok=false;st.msg='reveal'}else st.msg='retry';
  }
  render();
}
function setAv(k,v){
  const a=getAv();
  if(k==='skin'||k==='hair'||k==='outfit')a[k]=Number(v);
  else if(k==='style')a.style=v;
  else if(k==='item'){
    const it=ITEMS.find(x=>x.id===v);if(!it)return;
    if(it.slot==='extra')a.extra=a.extra.includes(v)?a.extra.filter(x=>x!==v):[...a.extra,v];
    else if(it.slot==='head')a.head=a.head===v?'':v;
    else a.top=a.top===v?'tee':v;
  }
  store.set('lmath.avatar',a);render();
}
document.addEventListener('input',e=>{
  if(e.target.id==='ans'&&run&&run.mode==='exam')run.answers[run.i]=e.target.value.replace(/[^0-9]/g,'');
  if(e.target.id==='ans')e.target.value=e.target.value.replace(/[^0-9]/g,'');
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(e.target.id==='ans'&&run){e.preventDefault();if(run.mode==='exam')act('next');else guidedSubmit(e.target.value)}
  if(e.target.id==='pin')act('unlock');
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  act(b.dataset.act,b.dataset.v,b.dataset);
});
function act(a,v,d){
  const r=run;
  switch(a){
    case'sethome':S.home=v;store.set('lmath.home',v);S.view='home';render();break;
    case'rehome':S.view='pickhome';render();break;
    case'start':start(v);break;
    case'home':S.view='home';S.unlocked=false;run=null;render();break;
    case'nav':S.view=v;if(v!=='parent'){S.unlocked=false}S.pinErr=false;render();break;
    case'av':setAv(d.k,v);break;
    case'tab':S.tab=v;render();break;
    case'unlock':{const el=document.getElementById('pin');if(el&&el.value===String(S.settings.pin)){S.unlocked=true;S.pinErr=false}else S.pinErr=true;render();break}
    case'saveSettings':{
      const n=Number(document.getElementById('examLen').value),np=document.getElementById('newPin').value.trim();
      S.settings.examLen=n;S.settings.examTimer=document.getElementById('examTimer').value!=='off';if(/^\d{4,8}$/.test(np))S.settings.pin=np;
      store.set('lmath.settings',S.settings);
      render();const s=document.getElementById('saved');if(s)s.textContent=np&&!/^\d{4,8}$/.test(np)?'Saved. PIN must be 4 to 8 digits, so it was not changed.':'Saved.';break}
    case'pick':
      if(r.mode==='exam'){r.answers[r.i]=v;render()}else guidedSubmit(v);break;
    case'check':{const el=document.getElementById('ans');guidedSubmit(el?el.value:'');break}
    case'hint':r.st[r.i].hint=true;render();break;
    case'prev':if(r.i>0){r.i--;render()}break;
    case'goto':r.i=Number(v);r.review=false;render();break;
    case'next':
      if(r.mode==='exam'){if(r.i<r.qs.length-1){r.i++;render()}else{r.review=true;render()}}
      else if(r.i<r.qs.length-1){r.i++;render()}else finish();
      break;
    case'begin':r.started=true;r.tickAt=Date.now();render();break;
    case'submitExam':finish();break;
  }
}
render();
initDb();
</script>
</body></html>
