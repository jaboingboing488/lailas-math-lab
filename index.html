<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7A1220">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Practice math, spelling, sports and geography.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Laila's Lab">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Laila's Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@600;700&family=Cinzel:wght@600;700;800&display=swap">
<style>
/* Layout: iOS-style single column. Translucent top bar, big titles, grouped cards, floating tab bar.
   Palette: Hogwarts. Parchment and candlelight by day, the Great Hall at night. */
:root{
  --bg:#F6EEDC; --bg2:#E6D2A0; --card:#FFFBF0; --card2:#F8F0DD; --ink:#2B1B14; --mute:#78613F; --line:rgba(90,60,20,.18);
  --accent:#8A1523; --accent-ink:#FFF3D6; --accent-soft:#F2DFC6; --lilac:#14275E;
  --good:#1F6B3A; --good-bg:#DCEBCF; --warn:#9A4A00; --warn-bg:#F6E0BC; --gold:#C8921A; --spark:rgba(200,146,26,.5);
  --hero1:#7A1220; --hero2:#14275E;
  --shadow:0 8px 24px rgba(70,40,10,.16),0 1px 3px rgba(60,30,10,.12); --bar:rgba(246,238,220,.85);
  --f-head:'Cinzel','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;
  --f-ui:-apple-system,BlinkMacSystemFont,'SF Pro Rounded','SF Pro Display','Inter',system-ui,'Segoe UI',sans-serif;
  --f-num:'SF Mono','JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0D1A; --bg2:#271B35; --card:#151729; --card2:#1E2038; --ink:#F5E9CC; --mute:#B8AB8C; --line:rgba(245,220,160,.14);
  --accent:#E3B94F; --accent-ink:#1C1405; --accent-soft:#3A2F14; --lilac:#8FA6F0;
  --good:#6FD09A; --good-bg:#123524; --warn:#FFB45C; --warn-bg:#3F2A10; --gold:#E9BE4A; --spark:rgba(240,200,110,.7);
  --hero1:#5E0F1B; --hero2:#1A2A66;
  --shadow:0 10px 30px rgba(0,0,0,.5); --bar:rgba(11,13,26,.85); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0D1A; --bg2:#271B35; --card:#151729; --card2:#1E2038; --ink:#F5E9CC; --mute:#B8AB8C; --line:rgba(245,220,160,.14);
  --accent:#E3B94F; --accent-ink:#1C1405; --accent-soft:#3A2F14; --lilac:#8FA6F0;
  --good:#6FD09A; --good-bg:#123524; --warn:#FFB45C; --warn-bg:#3F2A10; --gold:#E9BE4A; --spark:rgba(240,200,110,.7);
  --hero1:#5E0F1B; --hero2:#1A2A66;
  --shadow:0 10px 30px rgba(0,0,0,.5); --bar:rgba(11,13,26,.85); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background-color:var(--bg);
  background-image:radial-gradient(120% 60% at 15% 0%,var(--bg2),transparent 60%),radial-gradient(1.6px 1.6px at 18px 24px,var(--spark),transparent),radial-gradient(1.1px 1.1px at 66px 72px,var(--spark),transparent);
  background-size:auto,96px 96px,96px 96px;background-attachment:fixed,scroll,scroll;
  color:var(--ink);font:500 17px/1.45 var(--f-ui);padding-inline:16px;padding-block:0 120px;min-height:100vh}
#app{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;font-family:var(--f-head);font-weight:800;letter-spacing:.01em;text-wrap:balance;line-height:1.15;overflow-wrap:anywhere}
h1{font-size:1.9rem} h2{font-size:1.35rem} h3{font-size:1rem}
p{margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* top bar */
.navbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-inline:-16px;padding:12px 16px 10px;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line)}
.navbar .mid{font-weight:800;font-size:1.02rem;text-align:center;flex:1;min-width:0}
.back{display:inline-flex;align-items:center;gap:2px;color:var(--accent);font-weight:700;min-height:44px;padding-right:8px}
.back svg{width:22px;height:22px}
.largehead{padding-top:18px;display:flex;flex-direction:column;gap:2px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 12px;font-weight:800;font-size:.82rem}
.pill.plain{background:var(--card2);color:var(--mute);border:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good)}
.dot.off{background:var(--gold)}

/* cards and buttons */
.card{background:var(--card);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.btn{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:13px 26px;font-weight:800;font-size:1.04rem;min-height:50px}
.btn.tint{background:var(--accent-soft);color:var(--accent)}
.btn.quiet{background:var(--card2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
@media(prefers-reduced-motion:no-preference){.btn,.choice,.mode,.tab,.swatch,.item{transition:transform .12s ease,box-shadow .12s}.btn:active,.choice:active,.mode:active,.item:active{transform:scale(.97)}}

/* home */
.hero{background:linear-gradient(140deg,var(--hero1),var(--hero2));color:#fff;border-radius:28px;padding:20px;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:center;box-shadow:inset 0 0 0 2px rgba(233,190,74,.55),var(--shadow)}
.hero .who{display:flex;flex-direction:column;gap:2px;min-width:0}
.hero .who h2{color:#fff}
.hero .who span{opacity:.9;font-weight:600;font-size:.95rem}
.hero .av{width:104px;height:112px;background:rgba(255,255,255,.22);border-radius:26px;display:grid;place-items:center;overflow:hidden}
.stats{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.stat{background:rgba(255,255,255,.2);border-radius:16px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:1.5rem;font-weight:800;line-height:1.1}
.stat span{font-weight:700;font-size:.78rem;opacity:.92}
.journey{grid-column:1/-1;background:rgba(8,6,24,.42);border-radius:18px;padding:12px 12px 8px;margin-top:4px}
.journey svg{width:100%;display:block}
.journey text{fill:#fff;font-family:var(--f-ui);font-size:9.5px;font-weight:700}
.journey p{font-size:.9rem;font-weight:700;margin-top:2px}
.sect{font-weight:800;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);padding:6px 6px 0}
.modes{display:flex;flex-direction:column;gap:10px}
.mode{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;text-align:left;background:var(--card);border-radius:22px;padding:14px 16px;box-shadow:var(--shadow);min-height:84px}
.mode .ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.mode .ic svg{width:30px;height:30px}
.mode.lead .ic{background:var(--accent);color:var(--accent-ink)}
.mode h3{font-size:1.12rem}
.mode span.d{color:var(--mute);font-size:.92rem;display:block}
.mode .go{color:var(--mute);width:20px;height:20px}
.spark{background:var(--card2);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:4px;box-shadow:inset 0 0 0 1px var(--line)}
.spark b{color:var(--accent);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em}

/* bracelet */
.bracelet{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:6px 0;position:relative}
.bead{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:1.15rem;color:#fff;background:#8E1B26;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),0 2px 6px rgba(0,0,0,.25)}
.bead:nth-child(4n+2){background:#2B4590}
.bead:nth-child(4n+3){background:#A06E0C}
.bead:nth-child(4n){background:#2B6B3C}
.bead.off{background:var(--card2);color:var(--mute);box-shadow:inset 0 0 0 2px var(--line)}
.dl{display:flex;flex-direction:column;gap:8px;font-size:.92rem}
.dl div{display:flex;gap:10px;align-items:baseline}
.dl b{min-width:112px}
.dl .off{opacity:.55}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-top:1px solid var(--line)}
.tabbar>div{display:flex;gap:6px;width:100%;max-width:720px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mute);font-weight:700;font-size:.72rem;min-height:52px;border-radius:14px}
.tab svg{width:26px;height:26px}
.tab.on{color:var(--accent)}

/* run */
.track{position:relative;height:48px;margin-top:2px}
.track .lane{position:absolute;left:0;right:0;top:34px;height:8px;border-radius:99px;background:var(--accent-soft);overflow:hidden}
.track .lane i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--lilac));border-radius:99px;transition:width .4s}
.track .kart{position:absolute;top:0;width:56px;transition:left .4s}
.track .flag{position:absolute;right:0;top:6px;width:22px;height:30px}
.score{display:flex;gap:8px;align-items:center;font-weight:800}
.qtext{font-family:var(--f-num);font-weight:700;font-size:clamp(1.9rem,8vw,2.8rem);line-height:1.25;overflow-wrap:anywhere}
.qtext.word{font-family:var(--f-ui);font-weight:700;font-size:1.3rem;line-height:1.45}
.stack{display:inline-grid;align-self:flex-start;font-family:var(--f-num);font-weight:700;font-size:clamp(2.1rem,9vw,3.1rem);line-height:1.3;border-bottom:4px solid var(--ink);padding:0 4px 4px;min-width:5ch}
.stack>div{display:flex;justify-content:space-between;gap:1.2ch}
.stack>div:first-child{justify-content:flex-end}
.pill.timer{background:var(--accent-soft);color:var(--accent);font-size:.95rem;min-width:64px;justify-content:center}
.pill.timer.warn{background:var(--warn-bg);color:var(--warn)}
.tbar{height:6px;border-radius:99px;background:var(--accent-soft);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--accent);transition:width 1s linear}
.tbar i.warn{background:var(--warn)}
.paper{background:var(--warn-bg);color:var(--warn);border-radius:16px;padding:10px 14px;font-weight:700;font-size:.93rem}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.choice{background:var(--card2);box-shadow:inset 0 0 0 2px var(--line);border-radius:20px;padding:16px;font-family:var(--f-num);font-weight:700;font-size:1.65rem;min-height:70px}
.choice:hover:not(:disabled){box-shadow:inset 0 0 0 3px var(--accent)}
.choice.sel{background:var(--accent-soft);box-shadow:inset 0 0 0 3px var(--accent)}
.choice.bad{background:var(--warn-bg);box-shadow:inset 0 0 0 3px var(--warn);opacity:.7}
.choice.ok{background:var(--good-bg);box-shadow:inset 0 0 0 3px var(--good)}
input.ans{font-family:var(--f-num);font-weight:700;font-size:2rem;width:100%;max-width:280px;padding:10px 16px;border:0;border-radius:18px;background:var(--card2);box-shadow:inset 0 0 0 2px var(--line);color:var(--ink)}
.cal .calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:10px}
.cal .dow{text-align:center;font-weight:800;font-size:.72rem;color:var(--mute)}
.cal .cd{aspect-ratio:1/1.1;border-radius:10px;background:var(--card2);box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:3px 0 4px;min-width:0;min-height:44px;color:var(--ink)}
.cal .cd.out{visibility:hidden;box-shadow:none;background:none}
.cal .cd.today{box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft)}
.cal .cd.sel{outline:2px solid var(--gold);outline-offset:1px}
.cal .dn2{font-weight:800;font-size:.85rem;line-height:1.1}
.cal .ev{font-size:.7rem;line-height:1;min-height:.7rem}
.cal .dts{display:flex;gap:2px;min-height:6px}
.cal .dts i{width:5px;height:5px;border-radius:50%}
.cal .calday{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.cal .calday ul{margin:6px 0 0;padding-left:18px;display:grid;gap:4px}
.learn ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.learn li{display:flex;gap:10px;align-items:flex-start}
.learn li i{font-style:normal;flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-size:.85rem;font-weight:800}
.revcard{box-shadow:inset 0 0 0 2px var(--gold)}
.dn{display:block;color:var(--good);font-weight:700;font-size:.78rem;margin-top:2px}
.fb{border-radius:18px;padding:12px 16px;font-weight:800}
.fb.good{background:var(--good-bg);color:var(--good)}
.fb.try{background:var(--warn-bg);color:var(--warn)}
.steps{background:var(--card2);border-radius:18px;padding:14px 16px 14px 36px;margin:0;display:flex;flex-direction:column;gap:6px;box-shadow:inset 0 0 0 1px var(--line)}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav button{width:42px;height:42px;border-radius:12px;background:var(--card2);box-shadow:inset 0 0 0 2px var(--line);font-family:var(--f-num);font-weight:700}
.nav button.done{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.nav button.cur{background:var(--accent);color:var(--accent-ink)}
.bigscore{font-family:var(--f-num);font-weight:800;font-size:3.2rem;line-height:1}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;height:120px}
.podium div{width:84px;border-radius:14px 14px 0 0;background:var(--accent-soft);color:var(--mute);text-align:center;font-weight:800;padding-top:8px}
.podium .me{background:linear-gradient(var(--accent),var(--lilac));color:#fff}
details{background:var(--card2);border-radius:18px;padding:12px 16px;box-shadow:inset 0 0 0 1px var(--line)}
summary{cursor:pointer;font-weight:800}

/* closet */
.avbig{display:grid;place-items:center;background:linear-gradient(160deg,var(--accent-soft),var(--card2));border-radius:28px;padding:10px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:44px;height:44px;border-radius:50%;box-shadow:inset 0 0 0 3px var(--card),0 0 0 1px var(--line)}
.swatch.on{box-shadow:inset 0 0 0 3px var(--card),0 0 0 3px var(--accent)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{background:var(--card2);border-radius:18px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px;box-shadow:inset 0 0 0 2px var(--line);min-height:76px}
.item.on{box-shadow:inset 0 0 0 3px var(--accent);background:var(--accent-soft)}
.item.lock{opacity:.55}
.item small{color:var(--mute);font-weight:700}

/* parent */
.seg{display:flex;background:var(--card2);border-radius:14px;padding:3px;box-shadow:inset 0 0 0 1px var(--line)}
.seg button{flex:1;padding:9px 6px;border-radius:11px;font-weight:700;font-size:.92rem;min-height:40px;color:var(--mute)}
.seg.wrap{flex-wrap:wrap}.seg.wrap button{flex:1 1 30%}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.bar{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) 52px;gap:10px;align-items:center;font-size:.92rem}
.bar .track2{background:var(--accent-soft);border-radius:8px;height:14px;overflow:hidden}
.bar .fill{display:block;height:100%;background:var(--accent);border-radius:8px}
.bar .fill.low{background:var(--warn)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-size:.76rem;text-transform:uppercase;letter-spacing:.06em}
.chart text{fill:var(--mute);font-family:var(--f-ui);font-size:11px;font-weight:700}
select,input.txt{font:inherit;padding:8px 14px;border:0;border-radius:14px;background:var(--card2);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line);min-height:44px}
/* chips, skills, spelling */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border-radius:999px;padding:8px 14px;font-weight:800;font-size:.9rem;min-height:40px;background:var(--card2);color:var(--mute);box-shadow:inset 0 0 0 2px var(--line)}
.chip.on{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.skill{background:var(--card);border-radius:20px;padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);min-height:84px;min-width:0}
.skill b{font-size:1rem;line-height:1.25}
.skill .track2{background:var(--accent-soft);border-radius:8px;height:8px;overflow:hidden}
.skill .fill{display:block;height:100%;background:var(--accent);border-radius:8px}
.skill .fill.low{background:var(--warn)}
.skill small{color:var(--mute);font-weight:700}
.arr{display:grid;gap:4px;align-self:flex-start;padding:4px 0}
.arr i{width:14px;height:14px;border-radius:50%;background:var(--accent)}
.wchips{display:flex;flex-wrap:wrap;gap:8px}
.wchip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 14px;font-weight:700;background:var(--card2);box-shadow:inset 0 0 0 2px var(--line);min-height:40px}
.wchip i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.wchip i.m{background:var(--good)} .wchip i.l{background:var(--gold)} .wchip i.t{background:var(--warn)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--mute);font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.bigword{font-size:clamp(2.4rem,11vw,3.6rem);font-weight:800;letter-spacing:.04em;text-align:center;padding:14px 8px;background:var(--accent-soft);border-radius:22px;overflow-wrap:anywhere}
.bigword b{color:var(--accent)}
.dashes{font-family:var(--f-num);font-size:2rem;letter-spacing:.3em;text-align:center;color:var(--mute);padding:10px 0;overflow-wrap:anywhere}
input.ans.w{font-family:var(--f-ui);max-width:460px;font-size:1.6rem;letter-spacing:.03em}
.lts{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.lt{width:clamp(30px,8.6vw,46px);height:clamp(40px,11vw,56px);border-radius:12px;display:grid;place-items:center;font-family:var(--f-num);font-weight:800;font-size:clamp(1.3rem,5.5vw,1.9rem);background:var(--card2);box-shadow:inset 0 0 0 2px var(--line)}
.lt.blank{background:transparent;box-shadow:inset 0 -4px 0 var(--mute)}
.lt.cur{box-shadow:inset 0 -4px 0 var(--accent);background:var(--accent-soft)}
.lt.good{background:var(--good-bg);color:var(--good);box-shadow:inset 0 0 0 2px var(--good)}
.lt.bad{background:var(--warn-bg);color:var(--warn);box-shadow:inset 0 0 0 2px var(--warn)}
button.lt{cursor:pointer;padding:0}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tile{min-width:56px;height:60px;border-radius:16px;font-family:var(--f-num);font-weight:800;font-size:1.7rem;background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 2px var(--line)}
.tile:hover:not(:disabled){box-shadow:inset 0 0 0 3px var(--accent)}
.tile:disabled{opacity:.25;cursor:default}
.tile.bad{background:var(--warn-bg);color:var(--warn);opacity:.55}
.tile.hintt{box-shadow:inset 0 0 0 4px var(--gold)}

<script>

const $app=document.getElementById('app');

/* every "today" in the app is today in Eastern time, whatever the device clock says */

const TYPES={
  sub2:{label:'Regroup tens (2-digit)',op:'-',gen(){for(;;){const a=ri(21,99),b=ri(11,a-1);if(dg(a)[0]<dg(b)[0])return[a,b]}}},
  sub3o:{label:'Regroup ones (3-digit)',op:'-',gen(){for(;;){const a=ri(120,999),b=ri(100,a-1),x=dg(a),y=dg(b);if(x[0]<y[0]&&x[1]>=1&&x[1]-1>=y[1]&&x[2]>=y[2])return[a,b]}}},

  sub3b:{label:'Regroup ones and tens',op:'-',gen(){for(;;){const a=ri(200,999),b=ri(100,a-1),x=dg(a),y=dg(b);if(x[0]<y[0]&&x[1]>=1&&x[1]-1<y[1]&&x[2]-1>=y[2])return[a,b]}}},

  word:{label:'Word problems',op:'?',gen(){return[0,0]}},
  miss:{label:'Find the missing number',op:'?',gen(){return[0,0]}},

  mulmiss:{label:'Missing factor',op:'?',gen(){return[0,0]}},

const TYPE_KEYS=Object.keys(TYPES);
const GROUPS=[
  {k:'sub',label:'Subtraction',types:['sub2','sub3o','sub3t','sub3b','subz','sub32']},
  {k:'add',label:'Addition',types:['add3']},
  {k:'mul',label:'Multiplication',types:['mulA','mulB','mulC','mulD','mul10','mulmiss','mulword']},
  {k:'word',label:'Word problems',types:['word']},
  {k:'miss',label:'Missing number',types:['miss']}

const SKILL_SECTIONS=[['Subtraction',GROUPS[0].types],['Addition',GROUPS[1].types],['Multiplication',GROUPS[2].types],['Problem solving',['word','miss']]];
const opSym=op=>op==='-'?'−':op==='×'?'×':'+';
const wordish=q=>q.type==='word'||q.type==='mulword';
const missish=q=>q.type==='miss'||q.type==='mulmiss';
const MULW=[
  (a,b,n)=>`${n} has ${a} bags with ${b} apples in each bag. How many apples does ${n} have in all?`,
  (a,b)=>`There are ${a} rows of chairs with ${b} chairs in each row. How many chairs are there?`,
  (a,b)=>`A soccer team does ${b} passing drills each day for ${a} days. How many drills is that in all?`,
  (a,b,n)=>`${n} puts ${b} stickers on each of ${a} pages. How many stickers are on the pages?`,
  (a,b)=>`Each pack has ${b} pencils. How many pencils are in ${a} packs?`

  (a,b,n)=>`${n} collected ${a} shells at the beach and gave ${b} shells to a friend. How many shells does ${n} have now?`,
  (a,b)=>`There were ${a} books on the library shelves. Students borrowed ${b} of them. How many books are left on the shelves?`,
  (a,b)=>`A farm stand had ${a} apples. It sold ${b} apples today. How many apples are left?`,
  (a,b,n)=>`${n} needs ${a} points to win a game and has ${b} points so far. How many more points does ${n} need?`

  (a,b,n)=>`${n} read ${a} pages last week and ${b} pages this week. How many pages did ${n} read in all?`,

  const per={};
  items.forEach(i=>{
    const ks=new Set([i.t]);if(i.k&&i.k!=='word')ks.add(i.k);
    ks.forEach(k=>{per[k]=(per[k]||0)+1;if(per[k]>limit||!m[k])return;m[k].n++;if(i.ok)m[k].c++});
  });
  return m;
}

const PRIOR={sub2:3,sub3o:3,sub3t:3,sub3b:3,subz:3,sub32:3,add3:1,word:1.5,miss:1.5,mulA:2,mulB:2,mulC:2,mulD:2,mul10:2,mulmiss:1.5,mulword:1.5};
const WEIGHT={sub3b:2,sub3t:2,word:2};
function activeTypes(){
  const on=GROUPS.filter(g=>S.topics.includes(g.k)).flatMap(g=>g.types);
  return on.length?on:['sub2'];
}
function planTypes(mode,n){
  const act=activeTypes();
  if(mode==='smart'){
    const acc=typeAcc(stats().items,20);
    const w=act.map(k=>{const a=acc[k];return a.n<3?(PRIOR[k]||2):0.5+3*(1-a.c/a.n)});
    const out=[];
    for(let i=0;i<n;i++){let r=Math.random()*w.reduce((x,y)=>x+y,0),k=0;while(r>w[k]&&k<w.length-1){r-=w[k];k++}out.push(act[k])}
    return out;
  }
  const base=act.flatMap(k=>Array(WEIGHT[k]||1).fill(k));
  let out=shuffle(base);
  while(out.length<n)out=out.concat(shuffle(base));
  return out.slice(0,n);
}
function start(mode,skill,opts){
  const rv=opts&&opts.types&&opts.types.length?shuffle(opts.types):null;
  const n=skill?10:mode==='exam'?Number(S.settings.examLen)||12:10;
  const types=skill?Array(n).fill(skill):rv?Array.from({length:n},(_,i)=>rv[i%rv.length]):planTypes(mode,n);
  const fmts=shuffle(types.map((_,i)=>i%2?'mc':'type')),lvs=mathLevels();
  const qs=types.map((t,i)=>makeQ(t,fmts[i],mode==='exam'?1:(lvs[t]==null?1:lvs[t])));
  S.from='math';
  run={mode,skill:skill||null,rev:!!rv,qs,i:0,t0:Date.now(),answers:qs.map(()=>''),review:false,used:qs.map(()=>0),tickAt:Date.now(),started:mode!=='exam'||!timerOn(),

}

          const d=pick(HUNT_DIRS),r=ri(0,N-1-d[0]*(w.length-1)),c=ri(0,N-1-d[1]*(w.length-1));
          const cells=[...w].map((_,k)=>[r+d[0]*k,c+d[1]*k]);
          if(cells.every(([y,x],k)=>g[y][x]===''||g[y][x]===w[k])){cells.forEach(([y,x],k)=>{g[y][x]=w[k]});placed.push({w,cells,found:false,h:0,color:0});done=true}
        }
        if(!done){ok=false;break}
      }
      if(ok){
        for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(g[y][x]==='')g[y][x]=String.fromCharCode(97+ri(0,25));
        placed.sort((a,b)=>words.indexOf(a.w)-words.indexOf(b.w));
        return{N,g,words:placed,cellColor:{},mark:null,hintCell:null,msg:null,done:false,clue:S.huntClues};
      }
    }
  }
  return null;
}
function huntLine(a,b){
  const dr=b[0]-a[0],dc=b[1]-a[1];
  if(!dr&&!dc)return[a];
  if(dr&&dc&&Math.abs(dr)!==Math.abs(dc))return null;
  const n=Math.max(Math.abs(dr),Math.abs(dc)),sr=Math.sign(dr),sc=Math.sign(dc);
  return Array.from({length:n+1},(_,k)=>[a[0]+sr*k,a[1]+sc*k]);
}
function huntSnap(a,p){
  const dr=p[0]-a[0],dc=p[1]-a[1];if(!dr&&!dc)return[a];
  const k=Math.round(Math.atan2(dr,dc)/(Math.PI/4)),d=DIRS8[((k%8)+8)%8];
  const len=Math.max(0,Math.round((dr*d[0]+dc*d[1])/(d[0]*d[0]+d[1]*d[1]))),N=sp.hunt.N,out=[];
  for(let i=0;i<=len;i++){const r=a[0]+d[0]*i,c=a[1]+d[1]*i;if(r<0||c<0||r>=N||c>=N)break;out.push([r,c])}
  return out;
}
function huntTry(cells){
  const h=sp.hunt,str=cells.map(([r,c])=>h.g[r][c]).join(''),rev=[...str].reverse().join('');
  const w=h.words.find(x=>!x.found&&(x.w===str||x.w===rev));
  if(!w)return false;
  w.found=true;w.color=(h.words.filter(x=>x.found).length-1)%6;
  cells.forEach(([r,c])=>{h.cellColor[r+','+c]=w.color});
  h.msg=pick(CHEERS)+' You found '+w.w+'.';h.hintCell=null;
  if(h.words.every(x=>x.found)){h.done=true;h.msg='You found every word!'}
  return true;
}
let drag=null;
function cellAt(e){const el=document.elementFromPoint(e.clientX,e.clientY),c=el&&el.closest?el.closest('.hc'):null;return c?[Number(c.dataset.r),Number(c.dataset.c)]:null}
function paintSel(cells){
  document.querySelectorAll('.hc.sel').forEach(x=>x.classList.remove('sel'));
  cells.forEach(([r,c])=>{const el=document.querySelector(`.hc[data-r="${r}"][data-c="${c}"]`);if(el)el.classList.add('sel')});
}
function huntEnd(){
  if(!drag)return;
  const d=drag,h=sp&&sp.hunt;drag=null;if(!h)return;
  const miss='Not one of the words. Try again!';
  if(d.cells.length>1){h.mark=null;h.msg=huntTry(d.cells)?h.msg:miss}
  else if(h.mark&&!(h.mark[0]===d.start[0]&&h.mark[1]===d.start[1])){
    const line=huntLine(h.mark,d.start);h.mark=null;
    h.msg=line&&line.length>1?(huntTry(line)?h.msg:miss):null;
  }else{h.mark=h.mark?null:d.start;h.msg=h.mark?'Now tap the last letter of the word.':null}
  render();
}
document.addEventListener('pointerdown',e=>{
  if(!sp||sp.game!=='hunt'||S.view!=='sprun'||sp.hunt.done)return;

});
document.addEventListener('pointermove',e=>{

function nflInfo(list){
  const att={};
  list.slice().sort((a,b)=>a.ts-b.ts).forEach(s=>(s.items||[]).forEach(i=>{if(i.k)(att[i.k]=att[i.k]||[]).push({ok:!!i.ok,h:!!i.h,c:i.c})}));
  const mastered=new Set(),level={};
  for(const k in att){
    let run=[],ever=false;
    att[k].forEach(x=>{if(x.ok&&!x.h)run.push(x);else run=[];if(run.length>=2&&run.some(r=>r.c!=='conf'))ever=true});
    if(ever)mastered.add(k);
    const lv=wordLevel(att[k].slice().reverse());
    level[k]=ever&&lv!=='t'?'m':lv==='m'?'l':lv;
  }
  const teamsM=TEAMS.filter(t=>mastered.has(t.id));
  const divsDone=DIVS.filter(d=>teamsIn(d).every(t=>mastered.has(t.id)));
  const confsDone=['AFC','NFC'].filter(c=>TEAMS.filter(t=>t.conf===c).every(t=>mastered.has(t.id)));
  const rulesM=RULES.filter(r=>mastered.has('r:'+r.id));
  const all=teamsM.length===TEAMS.length;
  const bonus=divsDone.length*10+confsDone.length*25+(all?50:0)+Math.floor(rulesM.length/8)*5;
  return{att,mastered,level,teamsM,divsDone,confsDone,rulesM,all,bonus};
}

function weightedPick(items,wf,n){
  const pool=items.slice(),out=[];
  while(out.length<n&&pool.length){
    const ws=pool.map(wf),tot=ws.reduce((a,b)=>a+b,0);let r=Math.random()*tot,j=0;
    while(j<pool.length-1&&r>ws[j]){r-=ws[j];j++}
    out.push(pool.splice(j,1)[0]);
  }
  return out;
}

  const ds=weightedPick(DIVS,d=>1+teamsIn(d).reduce((n,t)=>n+LV_W[inf.level[t.id]||'n'],0),4);
  const rounds=ds.map(d=>{
    const ans=teamsIn(d).map(t=>t.id);
    const decoys=shuffle(TEAMS.filter(t=>divOf(t)!==d)).slice(0,4).map(t=>t.id);
    return{div:d,ans,show:shuffle([...ans,...decoys]),sel:new Set(),tries:0,done:false,ok:false,msg:null,bad:[]};
  });
  S.from='fb';
  fd={rounds,i:0,t0:Date.now()};
  S.view='fdrun';render();
}
function fdToggle(id){
  const r=fd.rounds[fd.i];if(r.done||r.bad.includes(id))return;
  if(r.sel.has(id))r.sel.delete(id);else if(r.sel.size<4)r.sel.add(id);
  r.msg=null;
}
function fdCheck(){
  const r=fd.rounds[fd.i];if(r.done||r.sel.size!==4)return;
  r.tries++;
  const right=[...r.sel].filter(id=>r.ans.includes(id));
  if(right.length===4){r.done=true;r.ok=true;r.msg='right';r.cheer=pick(FB_CHEERS)}
  else if(r.tries>=2){r.done=true;r.msg='reveal'}
  else{r.msg='retry';r.bad=[...r.sel].filter(id=>!r.ans.includes(id));r.sel=new Set(right)}
}
function finishNfl(game,items,missed){
  const infoB=nflInfo(nflSess()),snap=prizeSnap(),ls=learnSnap('nfl');
  const key=game!=='draft'&&nq&&nq.review?'rev:nfl':'nfl:'+game,rep=actDone(key);
  let aw=nflAward(items);if(rep)aw=Object.assign({},aw,{parts:[],total:0,rep:true});
  const correct=items.filter(i=>i.ok).length;
  const started=game==='draft'?fd.t0:nq.t0;
  const sess={ts:Date.now(),mode:'nfl',home:S.home||'',correct,total:items.length,secs:Math.min(7200,Math.round((Date.now()-started)/1000)),stars:bdayX(aw.total),
    items:items.map(i=>({t:'nfl',g:game,c:i.c,k:i.k,ok:i.ok,h:i.h||0,err:null,a:key}))};
  const bs=stats().stars;
  saveSession(sess);
  const infoA=nflInfo(nflSess());
  const fresh=(a,b)=>a.filter(x=>!b.includes(x));
  fbres={game,sess,aw,missed,
    cards:fresh(infoA.teamsM.map(t=>t.id),infoB.teamsM.map(t=>t.id)).map(id=>teamById(id).name),
    divs:fresh(infoA.divsDone,infoB.divsDone),confs:fresh(infoA.confsDone,infoB.confsDone),
    allNow:infoA.all&&!infoB.all,rulesNew:infoA.rulesM.length-infoB.rulesM.length,
    milestone:infoA.bonus-infoB.bonus,
    items:prizeNew(snap),
    stops:journeyNew(bs),learn:learned('nfl',ls,sess.items)};
  S.view='fbres';render();
}
function finishQuiz(){
  const items=nq.qs.map((q,i)=>({k:q.k,c:q.c,ok:nq.st[i].ok,h:nq.st[i].h?1:0}));
  const missed=nq.qs.map((q,i)=>({q,st:nq.st[i]})).filter(x=>!x.st.ok).map(x=>({prompt:x.q.prompt,ans:x.q.ans,why:x.q.why}));
  if(nq.sport==='nfl')finishNfl(nq.game,items,missed);else finishOther(nq.sport,items,missed);
}
function finishDraft(){
  const items=[],missed=[];
  fd.rounds.forEach(r=>{
    r.ans.forEach(id=>{
      const ok=r.ok||r.sel.has(id);
      items.push({k:id,c:'draft',ok,h:r.tries>1||(!r.ok)?1:0});
      if(!ok)missed.push({prompt:`${r.div}: ${teamById(id).name}`,ans:r.div,why:`The ${teamById(id).nick} play in the ${r.div}.`});
    });
  });
  finishNfl('draft',items,missed);
}

/* ---------- math levels: each skill moves up or down from her last answers (level 1, 2 or 3) ---------- */
const LVFIT={
  sub2:(a,b,L)=>L===0?a<=55:a>=80,
  sub3o:(a,b,L)=>L===0?a<=450:a>=700,
  sub3t:(a,b,L)=>L===0?a<=450:a>=700,
  sub3b:(a,b,L)=>L===0?a<=450:a>=700,
  subz:(a,b,L)=>L===0?a<=500:a>=700,
  sub32:(a,b,L)=>L===0?a<=300:a>=700,
  add3:(a,b,L)=>L===0?a+b<=450:a+b>=850,
  mulA:(a,b,L)=>L===0?a*b<=20:a*b>=40,
  mulB:(a,b,L)=>L===0?a*b<=16:a*b>=28,
  mulC:(a,b,L)=>L===0?a*b<=36:a*b>=63,
  mulD:(a,b,L)=>L===0?a*b<=24:a*b>=48,
  mul10:(a,b,L)=>L===0?(a<=5&&b<=30&&a*b<=150):(Math.min(a,b)>=6&&Math.max(a,b)>=60)
};
function genAt(t,lv){
  const f=LVFIT[t];
  if(!f||lv==null||lv===1)return TYPES[t].gen();
  for(let i=0;i<120;i++){const ab=TYPES[t].gen();if(f(ab[0],ab[1],lv))return ab}
  return TYPES[t].gen();
}
/* A skill moves up after 6 or more clean answers (85% or better) at its level, and back down below 50%. Exams never change it. */
function mathLevels(){
  const seen={},out={};
  S.sessions.forEach(s=>{
    if(!['smart','guided'].includes(s.mode))return;
    (s.items||[]).slice().reverse().forEach(i=>{
      if(!i.t)return;
      (seen[i.t]||(seen[i.t]=[])).push({lv:typeof i.lv==='number'?i.lv:1,c:i.ok&&!i.h?1:0});
    });
  });
  Object.keys(seen).forEach(t=>{
    const a=seen[t],L=a[0].lv,same=a.filter(x=>x.lv===L).slice(0,8);
    let v=L;
    if(same.length>=6){const c=same.reduce((n,x)=>n+x.c,0)/same.length;if(c>=.85)v=Math.min(2,L+1);else if(c<.5)v=Math.max(0,L-1)}
    out[t]=v;
  });
  return out;
}

/* ---------- spaced review: something she missed comes back after 1 day, then 3 days, then 7 days ---------- */
const REV_GAP=[1,3,7];
function revRun(events){
  let st=null;
  events.forEach(e=>{
    if(!e.clean){st={stage:0,due:keyAdd(e.day,REV_GAP[0])};return}
    if(!st||st.stage>=3)return;
    if(e.day>=st.due){st.stage++;st.due=st.stage<3?keyAdd(e.day,REV_GAP[st.stage]):null}
  });
  return st;
}
/* what counts as one try, for each section: a word, a question, or (in math) a whole skill within one session */
function sessKeys(dom,items){
  const clean=new Set(),dirty=new Set();
  if(dom==='math'){
    const g={};
    items.forEach(i=>{if(i.t){const a=g[i.t]||(g[i.t]={n:0,c:0});a.n++;if(i.ok&&!i.h)a.c++}});
    Object.entries(g).forEach(([k,a])=>{if(a.n<2)return;const f=a.c/a.n;if(f>=.8)clean.add(k);else if(f<.6)dirty.add(k)});
  }else items.forEach(i=>{
    const k=dom==='sp'||dom==='es'?i.w:i.k;if(!k)return;
    if(i.ok&&!i.h){if(!dirty.has(k))clean.add(k)}else{dirty.add(k);clean.delete(k)}
  });
  return{clean,dirty};
}
let revMemo={sig:'',v:null};
function revAll(){
  const today=dayKey(Date.now()),sig=S.sessions.length+':'+(S.sessions[0]&&S.sessions[0].id)+':'+today+':'+allWords().length;
  if(revMemo.sig===sig)return revMemo.v;
  const words=new Set(allWords()),out={};
  const build=(dom,list,ok)=>{
    const ev=new Map();
    list.slice().sort((a,b)=>a.ts-b.ts).forEach(s=>{
      const day=dayKey(s.ts),sk=sessKeys(dom,s.items||[]);
      sk.dirty.forEach(k=>{if(ok(k))(ev.get(k)||ev.set(k,[]).get(k)).push({day,clean:false})});
      sk.clean.forEach(k=>{if(ok(k))(ev.get(k)||ev.set(k,[]).get(k)).push({day,clean:true})});
    });
    const due=[],all=new Map();
    ev.forEach((es,k)=>{const st=revRun(es);if(st){all.set(k,st.stage);if(st.stage<3&&st.due<=today)due.push({k,due:st.due})}});
    due.sort((a,b)=>a.due<b.due?-1:a.due>b.due?1:0);
    out[dom]={due,all};
  };
  build('math',mathSess(),k=>!!TYPES[k]);
  build('sp',spellSess(),k=>words.has(k));
  build('es',esSess(),k=>!!ES_BY[k]);
  build('geo',geoSess(),()=>true);
  build('soc',socSess(),()=>true);
  build('nfl',nflSess(),()=>true);
  out.lv=mathLevels();
  revMemo={sig,v:out};
  return out;
}
const REV_NAMES={math:'Math',sp:'Spelling',es:'Español',geo:'States',soc:'Soccer',nfl:'Football'};
function revLabel(dom,k){
  try{
    if(dom==='sp')return k;
    if(dom==='es'){const w=ES_BY[k];return w?w.es+' ('+w.en+')':k}
    if(dom==='math')return TYPES[k].label;
    if(dom==='geo'){
      const id=k.slice(2);
      if(k[0]==='f'){const q=FLQ.find(x=>x.id===id);return q?'Florida: '+q.q.slice(0,34):k}
      const s=STATES.find(x=>x.ab===id);return s?(k[0]==='a'?s.name+' code':s.name):k;
    }
    if(dom==='soc'){const q=SOCQ.find(x=>'s:'+x.id===k);return q?q.q.slice(0,40):k}
    if(dom==='nfl'){
      if(k.startsWith('r:')){const r=RULES.find(x=>'r:'+x.id===k);return r?r.q.slice(0,40):k}
      const tm=teamById(k);return tm?tm.nick:k;
    }
  }catch(e){}
  return k;
}
function reviewCard(dom){
  const d=revAll()[dom];if(!d||!d.due.length)return'';
  const n=d.due.length,names=d.due.slice(0,6).map(x=>revLabel(dom,x.k));
  return`<section class="card revcard"><div class="row between"><h3>Review time</h3><span class="pill">${n} to review</span></div>
  <p class="mute">These were tricky before. A quick review today helps them stick: ${esc(names.join(', '))}${n>6?' and more':''}.</p>
  <div class="row"><button class="btn" data-act="revstart" data-v="${dom}">Start review</button></div>${starTag('rev:'+dom)}</section>`;
}
function homeReview(){
  const r=revAll(),L=Object.keys(REV_NAMES).filter(k=>r[k]&&r[k].due.length&&((k!=='soc'&&k!=='nfl')||fbOn()));
  if(!L.length)return'';
  return`<section class="card revcard"><div class="row between"><h3>Review time</h3><span class="pill">${L.reduce((n,k)=>n+r[k].due.length,0)} to review</span></div>

  <div class="row">${L.map(k=>`<button class="btn tint" data-act="revstart" data-v="${k}">${REV_NAMES[k]} (${r[k].due.length})</button>`).join('')}</div></section>`;
}
let REVSET=null;
const rw=(key,base)=>REVSET?(REVSET.has(key)?40:.05):base;
function startReview(dom){
  const d=revAll()[dom];if(!d||!d.due.length)return;
  const keys=d.due.map(x=>x.k);
  if(dom==='sp'){startSpell('cards',shuffle(keys).slice(0,12));if(sp)sp.review=true}
  else if(dom==='es'){startEs('type',shuffle(keys).slice(0,12).map(k=>ES_BY[k]).filter(Boolean));if(es)es.review=true}
  else if(dom==='math')start('guided',null,{types:keys});
  else{
    const cnt=p=>keys.filter(k=>k[0]===p).length;
    const game=dom==='geo'?(cnt('f')>=cnt('g')&&cnt('f')>=cnt('a')?'gfl':cnt('a')>cnt('g')?'gab':'gcap'):dom==='soc'?'sall':(cnt('r')>keys.length/2?'rules':'quiz');
    startQuiz(game,keys);
  }
}
/* ---------- what you learned today ---------- */
function learnSnap(dom){
  const r=revAll(),d=r[dom]||{due:[],all:new Map()};
  let mast=new Set();
  if(dom==='sp'){const st=wordStats();allWords().forEach(w=>{if(wordLevel(st[w])==='m')mast.add(w)})}
  else if(dom==='es'){const st=esStats();ES_ALL.forEach(w=>{if(wordLevel(st[w.es])==='m')mast.add(w.es)})}
  else if(dom==='geo')mast=new Set(nflInfo(geoSess()).mastered);
  else if(dom==='soc')mast=new Set(nflInfo(socSess()).mastered);
  else if(dom==='nfl')mast=new Set(nflInfo(nflSess()).mastered);
  return{all:new Map(d.all),mast,lv:dom==='math'?Object.assign({},r.lv):null};
}
function learned(dom,snap,items){
  const after=learnSnap(dom),sk=sessKeys(dom,items),lab=k=>revLabel(dom,k);
  const mastered=[...after.mast].filter(k=>!snap.mast.has(k)).map(lab);
  const fixed=[...sk.clean].filter(k=>snap.all.has(k)&&snap.all.get(k)<3).map(lab);
  const done=[...after.all].filter(([k,s])=>s===3&&snap.all.has(k)&&snap.all.get(k)<3).map(([k])=>lab(k));
  const tricky=[...sk.dirty].map(lab),levels=[];
  if(dom==='math'&&snap.lv&&after.lv)Object.keys(after.lv).forEach(k=>{const a=snap.lv[k]==null?1:snap.lv[k],b=after.lv[k];if(b!==a)levels.push(TYPES[k].label+': '+(b>a?'moved up to':'back to')+' level '+(b+1))});
  return{mastered,fixed,done,tricky,levels,total:items.length,first:items.filter(i=>i.ok&&!i.h).length};
}
function learnHtml(l){
  if(!l)return'';
  const list=a=>esc(a.slice(0,8).join(', '))+(a.length>8?' and '+(a.length-8)+' more':'');
  const row=(ic,head,a)=>a.length?`<li><i>${ic}</i><span><b>${head}</b> ${list(a)}</span></li>`:'';
  const rows=row('★','Newly mastered:',l.mastered)+row('✓','Review finished:',l.done)+row('+','Fixed after a tricky try:',l.fixed)+row('↑','Level up:',l.levels)+row('?','Still tricky, so they will come back tomorrow:',l.tricky);
  return`<section class="card learn"><h3>What you learned today</h3><p class="mute">${l.first} of ${l.total} right on the first try.</p><ul>${rows||'<li><i>★</i><span>Everything went smoothly. Come back tomorrow to keep it sharp.</span></li>'}</ul></section>`;
}
/* ---------- read aloud for every question ---------- */
function mathSpeech(q){
  let s=q.text;
  if(!wordish(q))s=s.replace(/[−×+=?]/g,c=>({'−':' minus ','×':' times ','+':' plus ','=':' equals ','?':' what number '})[c]);
  if(q.fmt==='mc')s+='. The choices are '+q.choices.join(', ')+'.';
  return s.replace(/\s+/g,' ').trim();
}
const nqSpeech=q=>q.prompt+' The choices are '+q.opts.join(', ')+'.';
let spokeKey='';
function autoRead(){
  if(!S.settings.autoRead)return;
  let key='',txt='';
  if(S.view==='run'&&run&&run.qs&&!run.review&&!(run.mode==='exam'&&!run.started)){key='m'+run.t0+':'+run.i;txt=mathSpeech(run.qs[run.i])}
  else if(S.view==='nqrun'&&nq){key='n'+nq.t0+':'+nq.i;txt=nqSpeech(nq.qs[nq.i])}
  if(key&&key!==spokeKey){spokeKey=key;say(txt)}
}

const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const SUBJ_COL={math:'#3A7BFF',spell:'#E5409B',es:'#FF8A1F',geo:'#1FA971',soc:'#0E9F6E',nfl:'#B45309'};

const subjOfSess=s=>s.mode==='geo'?'geo':s.mode==='soc'?'soc':s.mode==='nfl'?'nfl':isEs(s)?'es':s.mode==='spell'?'spell':'math';
function eventsOn(key){
  const[y,m,d]=key.split('-').map(Number),out=[];
  UNIT3.forEach(u=>{if(u.date===key)out.push({k:'test',n:'Spelling test: '+u.note})});
  if(m===10&&d===31)out.push({k:'hol',n:'Halloween'});
  const b=bdayDate();if(b&&b.m===m-1&&b.d===d)out.push({k:'bday',n:'Your birthday!'});
  const compact=key.replace(/-/g,'');
  (getAv().events||[]).forEach(e=>{e=String(e);if(e.slice(0,8)===compact)out.push({k:'mine',n:e.slice(9)})});
  return out;
}
function practiceByDay(){
  const m=new Map();
  S.sessions.forEach(s=>{const k=dayKey(s.ts),e=m.get(k)||m.set(k,{subs:new Set(),n:0,stars:0}).get(k);e.subs.add(subjOfSess(s));e.n++;e.stars+=s.stars||0});
  return m;
}

function typedFb(it){

  if(it.msg==='retry')return`<div class="fb try">Not quite. Look at the letters, then try again.</div>${diffHtml(it.given,it.w)}`;
  if(it.msg==='reveal')return`<div class="fb try">The word is <b>${esc(it.w)}</b>. Look at the letters you missed.</div>${diffHtml(it.given,it.w)}`;
  return'';
}
const spInput=(val,ph)=>`<div class="row"><input class="ans w" id="spin" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Type your answer" placeholder="${esc(ph||'')}" value="${esc(val||'')}"></div>`;
/* each game returns [body html, action buttons shown until the word is done] */
const SPB={
  test(it){
    const clue=blankSent(it.w);
    return[`<p class="mute">Listen to the word and the sentence, then type the word. No hints, just like the real test.</p>
      <div class="row">${canSpeak()?hearBtn('Hear it'):`<div class="fb try">This browser can't read aloud. Clue: ${esc(clue||'ask a grown-up to say the word.')}</div>`}</div>${spInput(it.val)}`,''];
  },
  cards(it){
    const s=sentOf(it.w);
    if(it.phase==='look'&&!it.done)return[`<p class="mute">Look at the word. Say it. Spell it out loud: ${it.w.length} letters.</p><div class="bigword">${patWord(it.w)}</div>
      <div class="row">${hearBtn('Hear it')}${s?hearBtn('Hear a sentence','sphears'):''}</div>`,`<button class="btn" data-act="spcover">Cover it and write</button>`];
    return[`<p class="mute">${it.done?'':'The word is covered. Write it from memory.'}</p>
      ${it.done?`<div class="bigword">${patWord(it.w)}</div>`:`<div class="dashes" aria-label="${it.w.length} letters">${[...it.w].map(()=>'•').join(' ')}</div>${spInput('')}`}
      ${typedFb(it)}`,`<button class="btn" data-act="spcheck">Check</button><button class="btn quiet" data-act="sppeek">Peek again</button>`];
  },
  fill(it){
    const ord=new Map(it.blanks.map((b,k)=>[b,k])),b=blankSent(it.w);
    const letters=[...it.w].map((ch,i)=>{
      if(!ord.has(i))return`<span class="lt">${esc(ch)}</span>`;
      const k=ord.get(i);
      return k<it.filled.length?`<span class="lt good">${esc(ch)}</span>`:`<span class="lt ${k===it.filled.length?'cur':'blank'}" aria-label="missing letter"></span>`;
    }).join('');
    const need=it.done?'':it.w[it.blanks[it.filled.length]];
    const tiles=it.done?'':it.opts.map(c=>`<button class="tile ${it.badTiles.includes(c)?'bad':''} ${it.hint&&c===need?'hintt':''}" data-act="sptile" data-v="${c}" ${it.badTiles.includes(c)?'disabled':''}>${c}</button>`).join('');
    return[`<p class="mute">Tap the letter that belongs in the empty box.</p><div class="lts">${letters}</div>
      ${b?`<p class="mute">Clue: ${esc(b)}</p>`:''}<div class="row">${hearBtn('Hear it')}</div>
      ${it.done?`<div class="fb good">${BURST}${esc(it.cheer||'Nice!')} ${it.helped?'Done, with a little help.':'Spelled right!'}</div>`:`<div class="tiles">${tiles}</div>`}`,`<button class="btn quiet" data-act="sphint">Hint</button>`];
  },
  scramble(it){
    const full=!it.slots.includes(null),b=blankSent(it.w);
    const slots=it.slots.map((id,i)=>{
      if(id===null)return`<span class="lt blank" aria-label="empty"></span>`;
      const ch=it.w[id],good=it.done||it.locked[i]||(full&&ch===it.w[i]),bad=full&&!it.done&&ch!==it.w[i];
      return`<button class="lt ${good?'good':bad?'bad':''}" data-act="spslot" data-v="${i}" aria-label="Letter ${i+1}: ${ch}. Tap to take out" ${it.done||it.locked[i]?'disabled':''}>${esc(ch)}</button>`;
    }).join('');
    const tiles=it.order.map(id=>`<button class="tile" data-act="sptile" data-v="${id}" ${it.slots.includes(id)||it.done?'disabled':''}>${esc(it.w[id])}</button>`).join('');
    return[`<p class="mute">Tap the letters in the right order to spell the word. You can also type on a keyboard.</p><div class="lts">${slots}</div>
      <div class="tiles">${tiles}</div>${b?`<p class="mute">Clue: ${esc(b)}</p>`:''}<div class="row">${hearBtn('Hear it')}</div>
      ${it.msg==='retry'?`<div class="fb try">Almost! Green letters are in the right spot. Tap a letter to take it out.</div>`:''}
      ${it.done?`<div class="fb good">${BURST}${esc(it.cheer||'Nice!')} ${it.helped?'Solved, with a little help.':'Solved!'}</div>`:''}`,`<button class="btn quiet" data-act="sphint">Hint</button>`];
  },
  sent(it){
    const b=blankSent(it.w);
    return[`<p class="mute">${b?'Type the missing word.':'Listen, then type the word.'}</p><p class="qtext word">${esc(b||'Listen and type the word.')}</p>
      <div class="row">${hearBtn('Hear it')}</div>${it.hint&&!it.done?`<p class="mute num">Starts with <b>${esc(it.w[0])}</b>, ${it.w.length} letters</p>`:''}
      ${it.done?'':spInput('')}${typedFb(it)}`,`<button class="btn" data-act="spcheck">Check</button><button class="btn quiet" data-act="sphint">Hint</button>`];
  },
  write(it){
    const ex=sentOf(it.w);
    return[`<p class="mute">Write a sentence of your own that uses this word. Read it out loud when you finish.</p><div class="bigword">${esc(it.w)}</div>
      <div class="row">${hearBtn('Hear it')}</div>
      ${it.hint&&ex?`<div class="spark"><b>Example</b><p>${esc(ex)}</p></div>`:''}
      ${it.done?'':`<div class="row"><input class="ans w" id="spin" type="text" autocomplete="off" autocapitalize="sentences" autocorrect="off" spellcheck="false" aria-label="Your sentence" placeholder="Type your sentence" style="max-width:none;font-size:1.2rem" value="${esc(it.msg==='retry'?it.given:'')}"></div>`}
      ${it.chk?`<ul class="chk">${it.chk.map(([y,t])=>`<li class="${y?'y':'n'}">${y?'✓':'○'} ${esc(t)}</li>`).join('')}</ul>`:''}
      ${it.msg==='right'?`<div class="fb good">${BURST}${esc(it.cheer||'Nice!')} Great sentence!</div>`:''}
      ${it.msg==='reveal'?`<div class="fb try">Good try. Check the list above to see what to fix next time.</div>`:''}
      `,
      `<button class="btn" data-act="spcheck">Check</button><button class="btn quiet" data-act="sphint">Show an example</button>`];
  },
  spot(it){
    return[`<p class="qtext word">Which one is spelled right?</p><div class="choices w">${it.opts.map(o=>{
      let cls='choice';if(it.wrong.includes(o))cls+=' bad';if(it.done&&o===it.w)cls+=' ok';
      const dis=it.done||it.wrong.includes(o)||it.gone===o;
      return`<button class="${cls}" data-act="spopt" data-v="${esc(o)}" ${dis?'disabled':''} ${it.gone===o?'style="visibility:hidden"':''}>${esc(o)}</button>`}).join('')}</div>
      <div class="row">${hearBtn('Hear it')}</div>
      ${it.msg==='right'?`<div class="fb good">${BURST}${esc(it.cheer||'Nice!')} ${it.helped?'Right, on the second look.':'Spelled right!'}</div>`:''}
      ${it.msg==='retry'?`<div class="fb try">Not that one. Look closely at every letter and try again.</div>`:''}
      ${it.msg==='reveal'?`<div class="fb try">The right spelling is <b>${esc(it.w)}</b>.</div>`:''}`,`<button class="btn quiet" data-act="sphint">Hint</button>`];
  }
};

function fieldSvg(o){
  const ln='stroke="#fff" stroke-width=".9" fill="none"',font='style="font-family:Inter,system-ui,sans-serif"';
  let g='<rect x="0" y="0" width="100" height="140" rx="3" fill="#2E8B57"/>';
  for(let i=0;i<7;i+=2)g+=`<rect x="5" y="${(5+i*18.57).toFixed(1)}" width="90" height="18.57" fill="#fff" opacity=".07"/>`;
  g+=`<g ${ln}><rect x="5" y="5" width="90" height="130"/><path d="M5 70H95"/><circle cx="50" cy="70" r="10"/><rect x="25" y="5" width="50" height="22"/><rect x="25" y="113" width="50" height="22"/><rect x="38" y="5" width="24" height="9"/><rect x="38" y="126" width="24" height="9"/><path d="M42 5V1.5H58V5M42 135V138.5H58V135"/></g><circle cx="50" cy="70" r="1" fill="#fff"/>`;
  if(o.bol)g+=`<path d="M5 48.5H95M5 91.5H95" stroke="#FFD24D" stroke-width=".9" stroke-dasharray="3 2"/>`;
  (o.lines||[]).forEach(l=>{g+=`<path d="M${l[0]} ${l[1]}L${l[2]} ${l[3]}" stroke="${l[4]||'#fff'}" stroke-width="1.1" ${l[5]?'stroke-dasharray="2.5 2"':''} opacity=".92"/>`});
  (o.pl||[]).forEach(p=>{g+=`<circle cx="${p[0]}" cy="${p[1]}" r="5.2" fill="${p[3]||'#2B4590'}" stroke="#fff" stroke-width="1"/><text x="${p[0]}" y="${p[1]+1.5}" text-anchor="middle" font-size="4" font-weight="800" fill="#fff" ${font}>${p[2]}</text>`});
  if(o.ball)g+=`<circle cx="${o.ball[0]}" cy="${o.ball[1]}" r="2.6" fill="#fff" stroke="#222" stroke-width=".7"/>`;
  (o.txt||[]).forEach(t=>{g+=`<text x="${t[0]}" y="${t[1]}" text-anchor="middle" font-size="${t[3]||3.8}" font-weight="800" fill="${t[4]||'#fff'}" ${font}>${t[2]}</text>`});
  return`<svg class="field" viewBox="0 0 100 140" role="img" aria-label="${esc(o.alt||'Soccer field')}">${g}</svg>`;
}

function pickGeo(game){

const ES_CHEERS=['¡Muy bien!','¡Excelente!','¡Fantástico!','¡Perfecto!','¡Genial!','¡Bravo!','¡Qué bien!'];

const plainEs=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[¿¡?!.,]/g,'').replace(/\s+/g,' ').trim();
const isLetterWord=w=>/^[a-zñáéíóúü]{3,12}$/i.test(w.es);
let es=null,esVoice=null;
function pickVoiceEs(){
  if(esVoice)return esVoice;
  try{const vs=speechSynthesis.getVoices().filter(v=>/^es[-_]/i.test(v.lang));
    esVoice=vs.find(v=>/es[-_](MX|US)/i.test(v.lang)&&/paulina|monica|juan|google|premium|enhanced/i.test(v.name))||vs.find(v=>/es[-_](MX|US)/i.test(v.lang))||vs[0]||null}catch(e){}
  return esVoice;
}
function sayEs(...parts){
  if(!canSpeak())return;
  try{
    const ss=window.speechSynthesis;ss.cancel();
    parts.forEach(t=>{if(!t)return;const u=new SpeechSynthesisUtterance(t);u.lang='es-MX';u.rate=.8;const v=pickVoiceEs();if(v){u.voice=v;u.lang=v.lang}ss.speak(u)});
  }catch(e){}
}
function esStats(){
  const m={};
  esSess().slice().sort((a,b)=>b.ts-a.ts).forEach(s=>(s.items||[]).forEach(i=>{if(i.w)(m[i.w]=m[i.w]||[]).push({ok:!!i.ok,h:!!i.h})}));
  return m;
}
const esMastered=()=>{const st=esStats();return ES_ALL.filter(w=>wordLevel(st[w.es])==='m').length};
const esSel=()=>{const s=S.eslist;return s==='all'||s==='tricky'||ES_LISTS.some(l=>l.id===s)?s:'all'};
function esWordsOf(sel){
  if(sel==='all')return ES_ALL;
  if(sel==='tricky'){const st=esStats();return ES_ALL.filter(w=>wordLevel(st[w.es])==='t')}
  return(ES_LISTS.find(l=>l.id===sel)||ES_LISTS[0]).words;
}
function esPickWords(sel,letters){
  let ws=esWordsOf(sel);
  if(letters)ws=ws.filter(isLetterWord);
  if(ws.length<4)ws=letters?ES_ALL.filter(isLetterWord):ES_ALL;
  const st=esStats(),need=[],done=[];
  shuffle(ws).forEach(w=>(wordLevel(st[w.es])==='m'?done:need).push(w));
  return shuffle(need.concat(done).slice(0,12));
}
function esOpts(w){
  const same=ES_LISTS.find(l=>l.id===w.list).words.filter(x=>x.es!==w.es&&x.en!==w.en);
  const rest=ES_ALL.filter(x=>x.es!==w.es&&x.en!==w.en&&!same.includes(x));
  const bad=shuffle(same).slice(0,3);
  shuffle(rest).forEach(x=>{if(bad.length<3)bad.push(x)});
  return shuffle([w,...bad]);
}
function esInitItem(game,w,idx){
  const it={es:w.es,wd:w,w:w.es,tries:0,hint:false,done:false,ok:false,msg:null,given:''};
  if(game==='listen'){it.opts=esOpts(w);it.wrong=[]}
  if(game==='quiz'){it.kind=idx%3===2?'type':'mc';it.dir=idx%2?'en2es':'es2en';it.pick=null;it.val='';if(it.kind==='mc')it.opts=esOpts(w)}
  if(game==='fill'){it.w=plainEs(w.es);Object.assign(it,fillInit(it.w))}
  if(game==='scramble'){it.w=plainEs(w.es);Object.assign(it,scrInit(it.w))}
  return it;
}
function esMatchRounds(words){
  const half=words.length>=9?Math.ceil(words.length/2):words.length,parts=[words.slice(0,half)];
  if(words.length>half)parts.push(words.slice(half));
  return parts.map(ws=>({ws,right:shuffle(ws),sel:null,done:new Set(),msg:null}));
}
function startEs(game,words){
  const letters=game==='fill'||game==='scramble';
  words=words||esPickWords(esSel(),letters);
  if(!words.length)return;
  S.from='es';
  es={game,words,i:0,t0:Date.now(),items:[]};
  if(game==='match'){es.rounds=esMatchRounds(words);es.ri=0;es.wr={};es.items=words.map(w=>{es.wr[w.es]=0;return{es:w.es,wd:w}})}
  else es.items=words.map((w,i)=>esInitItem(game,w,i));
  S.view='esrun';render();esAuto();
}
function esAuto(){if(es&&es.game==='listen'&&es.items[es.i])sayEs(es.items[es.i].es)}
function esTyped(it,val){
  val=String(val).trim();if(!val)return;
  it.tries++;it.given=val;
  if(plainEs(val)===plainEs(it.es)){it.done=true;it.ok=true;it.helped=it.tries>1||it.hint;it.msg='right';it.cheer=pick(ES_CHEERS);sayEs(it.es)}
  else if(it.tries>=2){it.done=true;it.ok=false;it.msg='reveal'}
  else it.msg='retry';
}
function finishEs(){
  const g=es.game,key=es.review?'rev:es':'es:'+g,rep=actDone(key),snap=prizeSnap(),bs=stats().stars,ls=learnSnap('es'),pbB=rep?0:playbookBonus('es');
  let items;
  if(g==='match')items=es.items.map(it=>{const n=es.wr[it.es]||0;return{w:it.es,ok:n===0,h:0,given:''}});
  else items=es.items.map(it=>{
    if(g==='quiz'){
      const ok=it.kind==='type'?plainEs(it.val)===plainEs(it.es):it.pick===it.es;
      const given=it.kind==='type'?it.val.trim():String(it.pick||'');
      return{w:it.es,ok,h:0,given:given.slice(0,40)};
    }
    return{w:it.es,ok:!!it.ok,h:it.helped?1:0,given:String(it.given||'').slice(0,40)};
  });
  const correct=items.filter(i=>i.ok).length;
  const sess={ts:Date.now(),mode:'spell',home:S.home||'',correct,total:items.length,secs:Math.min(7200,Math.round((Date.now()-es.t0)/1000)),stars:rep?0:bdayX(starsFor(g==='quiz'?'estest':'es',credit(items))+pbB),
    items:items.map(i=>({t:'es',g,w:i.w,ok:i.ok,h:i.h,err:null,given:i.given,a:key}))};
  saveSession(sess);
  es.result=Object.assign({},sess,{items,unlocked:prizeNew(snap),stop:journeyNew(bs),pb:pbB,rep,learn:learned('es',ls,sess.items)});
  S.view='esresults';render();
}
function esBadges(){
  const ss=esSess(),st=esStats();
  const days=new Set(ss.map(s=>dayKey(s.ts))).size,m=ES_ALL.filter(w=>wordLevel(st[w.es])==='m').length;

    {l:'H',n:'¡Hola!',d:'Finish your first Spanish activity',on:ss.length>=1},
    {l:'3',n:'Tres días',d:'Practice Spanish on 3 different days',on:days>=3},

  },
  type(it){
    return[`<p class="mute">Type the Spanish word for:</p>${esPrompt(it.wd)}<div class="row">${hearBtn('Read it to me','eshearen')}</div>

      ${it.done?'':esInput('')}${esTypedFb(it)}`,`<button class="btn" data-act="escheck">Check</button><button class="btn quiet" data-act="eshint">Hint</button>`];
  },
  fill(it){
    const ord=new Map(it.blanks.map((b,k)=>[b,k]));
    const letters=[...it.w].map((ch,i)=>{
      const shown=it.done?it.es[i]:ch;
      if(!ord.has(i))return`<span class="lt">${esc(shown)}</span>`;
      const k=ord.get(i);
      return k<it.filled.length?`<span class="lt good">${esc(shown)}</span>`:`<span class="lt ${k===it.filled.length?'cur':'blank'}" aria-label="missing letter"></span>`;
    }).join('');
    const need=it.done?'':it.w[it.blanks[it.filled.length]];
    const tiles=it.done?'':it.opts.map(c=>`<button class="tile ${it.badTiles.includes(c)?'bad':''} ${it.hint&&c===need?'hintt':''}" data-act="estile" data-v="${c}" ${it.badTiles.includes(c)?'disabled':''}>${c}</button>`).join('');
    return[`<p class="mute">Tap the letter that belongs in the empty box.</p>${esPrompt(it.wd)}<div class="lts">${letters}</div><div class="row">${esHear('Escucha')}</div>
      ${it.done?`<div class="fb good">${BURST}${esc(it.cheer||'¡Muy bien!')} ${it.helped?'Done, with a little help.':'Spelled right!'}</div>`:`<div class="tiles">${tiles}</div>`}`,`<button class="btn quiet" data-act="eshint">Hint</button>`];
  },
  scramble(it){
    const full=!it.slots.includes(null);
    const slots=it.slots.map((id,i)=>{
      if(id===null)return`<span class="lt blank" aria-label="empty"></span>`;
      const ch=it.done?it.es[i]:it.w[id],good=it.done||it.locked[i]||(full&&it.w[id]===it.w[i]),bad=full&&!it.done&&it.w[id]!==it.w[i];

    }).join('');
    const tiles=it.order.map(id=>`<button class="tile" data-act="estile" data-v="${id}" ${it.slots.includes(id)||it.done?'disabled':''}>${esc(it.w[id])}</button>`).join('');
    return[`<p class="mute">Tap the letters in the right order to spell the word.</p>${esPrompt(it.wd)}<div class="lts">${slots}</div><div class="tiles">${tiles}</div><div class="row">${esHear('Escucha')}</div>

  },
  quiz(it){
    if(it.kind==='type')return[`<p class="mute">Type the Spanish word for:</p>${esPrompt(it.wd)}<div class="row">${hearBtn('Read it to me','eshearen')}</div>${esInput(it.val)}`,''];

    return[head+`<div class="choices w">${opts}</div>`,''];
  }
};

function esAct(a,v){
  const it=es&&es.items?es.items[es.i]:null;
  switch(a){
    case'eslist':S.eslist=v;store.set('lmath.eslist',v);render();return true;
    case'esstart':startEs(v);return true;
    case'esstudy':S.from='es';S.view='esstudy';render();return true;
    case'esflip':{const o=S.esOpen||(S.esOpen=new Set());if(o.has(v))o.delete(v);else{o.add(v);sayEs(v)}render();return true}
    case'esay':sayEs(v);return true;
    case'eshear':if(it)sayEs(it.es);return true;
    case'eshearen':if(it&&it.wd)say(it.wd.en);return true;
    case'esopt':{
      if(!it)return true;
      if(es.game==='quiz'){it.pick=v;render();return true}
      if(it.done||it.wrong.includes(v))return true;
      it.tries++;
      if(v===it.es){it.done=true;it.ok=true;it.helped=it.tries>1;it.msg='right';it.cheer=pick(ES_CHEERS);sayEs(it.es)}
      else{it.wrong.push(v);if(it.tries>=2){it.done=true;it.ok=false;it.msg='reveal'}else it.msg='retry'}
      render();return true}
    case'escheck':{const el=document.getElementById('esin');if(it&&!it.done&&el)esTyped(it,el.value);render();return true}
    case'eshint':{
      if(!it||it.done)return true;
      if(es.game==='scramble')scrHint(it);else it.hint=true;
      if(es.game==='type')sayEs(it.es);
      render();return true}
    case'estile':{
      if(!it)return true;
      if(es.game==='fill')fillTap(it,v);else scrPlace(it,Number(v));
      if(it.done&&it.ok)sayEs(it.es);
      render();return true}
    case'esslot':if(it)scrClear(it,Number(v));render();return true;
    case'esnext':{
      const el=document.getElementById('esin');
      if(es.game==='quiz'&&it.kind==='type'&&el)it.val=el.value;
      if(es.i<es.items.length-1){es.i++;render();esAuto()}else finishEs();
      return true}
    case'esmA':{const r=es.rounds[es.ri];if(!r.done.has(v)){r.sel=v;r.msg=null;sayEs(v)}render();return true}
    case'esmB':{
      const r=es.rounds[es.ri];if(!r.sel||r.done.has(v))return true;
      if(v===r.sel){r.done.add(v);r.sel=null;r.msg=null}
      else{es.wr[r.sel]=(es.wr[r.sel]||0)+1;r.sel=null;r.msg='retry'}
      render();return true}
    case'esmnext':if(es.ri<es.rounds.length-1){es.ri++;render()}else finishEs();return true;
    case'esagain':{
      if(v==='missed'){const w=es.result.items.filter(i=>!i.ok).map(i=>ES_BY[i.w]).filter(Boolean);startEs('type',shuffle(w))}
      else startEs(es.game);
      return true}
  }
  return false;
}

function roomPanel(area,R,ctx){
  const out=ROOM_G.filter(g=>g.area===area).map(g=>{
    let cur,head='';
    if(g.k==='poster'){
      const i=S.posSlot!=null?S.posSlot:Math.max(0,R.posters.indexOf('mine'));cur=[R.posters[i]];
      head=`<div class="seg wrap">${[0,1,2,3,4].map(n=>`<button class="${i===n?'on':''}" data-act="posslot" data-v="${n}">Poster ${n+1}${n>2?' (nook)':''}</button>`).join('')}</div><p class="mute">Choose a spot, then choose a poster. Tap it again to take it down.</p>`+(R.posters[i]==='mine'?mineEditor(R):'');
    }else cur=g.multi?R[g.k]:[R[g.k]];
    const btn=o=>{const un=ctx.has(o),on=cur.includes(o.id);
      const why=un?(on?(g.multi||g.k==='poster'?'In your room. Tap to remove.':'In your room'):'Tap to use'):lockText(o,ctx.env);
      return`<button class="item ${on?'on':''} ${un?'':'lock'}" ${un?'':'disabled'} data-act="room" data-k="${g.k}" data-v="${o.id}"><b>${o.sw?`<span class="sw" style="background:${o.sw}"></span>`:''}${esc(o.name)}</b><small>${esc(why)}</small></button>`};
    return`<div class="sect">${g.label}</div>${head}<section class="items">${g.opts.map(btn).join('')}</section>`;
  }).join('');
  return out;
}

function chart(list){
  const pts=(list||mathSess()).slice(0,30).reverse();
  if(pts.length<2)return`<p class="mute">The chart appears after two sessions.</p>`;
  const W=640,H=230,L=34,R=14,T=14,B=30,x=i=>L+(W-L-R)*(i/(pts.length-1)),y=p=>T+(H-T-B)*(1-p/100);
  let g='';
  [0,25,50,75,100].forEach(v=>g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`);
  g+=`<line x1="${L}" x2="${W-R}" y1="${y(80)}" y2="${y(80)}" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${W-R}" y="${y(80)-5}" text-anchor="end" style="fill:var(--good)">80% goal</text>`;
  const path=pts.map((s,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(pct(s)).toFixed(1)}`).join(' ');
  g+=`<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>`;
  pts.forEach((s,i)=>{const e=s.mode==='exam';g+=`<circle cx="${x(i).toFixed(1)}" cy="${y(pct(s)).toFixed(1)}" r="${e?6:4.5}" fill="${e?'var(--accent)':'var(--card)'}" stroke="var(--accent)" stroke-width="2.5"/>`});
  g+=`<text x="${L}" y="${H-8}">${fmtDate(pts[0].ts)}</text><text x="${W-R}" y="${H-8}" text-anchor="end">${fmtDate(pts[pts.length-1].ts)}</text>`;
  return`<div class="scroll"><svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Score history chart" style="min-width:420px">${g}</svg></div><p class="mute">Filled dots are practice exams. Hollow dots are practice sessions.</p>`;
}

  let h;
  switch(S.view){
    case'run':h=runView();break;
    case'results':h=resultsView();break;
    case'math':h=mathView();break;
    case'spell':h=spellView();break;
    case'es':h=esView();break;
    case'esstudy':h=esStudyView();break;
    case'esrun':h=esRunView();break;
    case'esresults':h=esResultsView();break;
    case'club':h=clubView();break;
    case'soc':h=socView();break;
    case'socstudy':h=socStudyView();break;
    case'geo':h=geoView();break;
    case'geostudy':h=geoStudyView();break;
    case'fb':h=fbView();break;
    case'fbstudy':h=fbStudyView();break;
    case'nqrun':h=nqRunView();break;
    case'fdrun':h=fdRunView();break;
    case'fbres':h=fbResView();break;

const THEME_OF={math:'math',run:'math',results:'math',spell:'spell',sprun:'spell',spresults:'spell',es:'es',esstudy:'es',esrun:'es',esresults:'es',geo:'geo',geostudy:'geo',club:'sport',soc:'sport',socstudy:'sport',fb:'sport',fbstudy:'sport',nqrun:'sport',fdrun:'sport',fbres:'sport',closet:'room'};
function themeClass(){
  return'';
  if((S.view==='nqrun'&&nq&&nq.sport==='geo')||(S.view==='fbres'&&fbres&&fbres.sport==='geo'))return'th-geo';
  return THEME_OF[S.view]?'th-'+THEME_OF[S.view]:'';
}
function render(){
  let h;
  try{h=buildView()}
  catch(e){
    console.error(e);
    try{S.view='home';h=buildView()}
    catch(e2){h='<section class="card"><h2>Something went wrong</h2><p class="mute">Your progress is safe. Tap the button to start again.</p><button class="btn" onclick="location.reload()">Reload</button></section>'}
  }
  $app.innerHTML=h;
  $app.className=themeClass();
  if(lastView!==S.view){window.scrollTo(0,0);lastView=S.view}
  const a=document.getElementById('ans')||document.getElementById('spin')||document.getElementById('esin');
  if(a&&!a.disabled)a.focus({preventScroll:true});
  const p=document.getElementById('pin');if(p)p.focus({preventScroll:true});
  autoRead();
}
function finish(){
  const exam=run.mode==='exam',key=exam?'exam':run.rev?'rev:math':run.skill?'sk:'+run.skill:run.mode,rep=actDone(key),before=stats().stars,snap=prizeSnap(),ls=learnSnap('math'),pbB=rep?0:playbookBonus('math');
  const items=run.qs.map((q,i)=>{
    const st=run.st[i];
    if(exam){
      const g=run.answers[i],ok=g!==''&&Number(g)===q.ans;
      return{t:q.type,k:q.kind,ok,to:timerOn()&&run.used[i]>=EXAM_SECS*1000?1:0,err:ok?null:g===''?'blank':classify(q,g),given:g,lv:1};
    }
    return{t:q.type,k:q.kind,ok:st.ok,h:st.helped?1:0,err:st.err||null,given:st.given,lv:q.lv==null?1:q.lv};
  });
  const correct=items.filter(i=>i.ok).length;
  const sess={ts:Date.now(),mode:run.mode,home:S.home||'',correct,total:items.length,secs:Math.min(7200,Math.round((Date.now()-run.t0)/1000)),stars:rep?0:bdayX(starsFor(exam?'exam':'math',credit(items))+pbB),items:items.map(i=>({t:i.t,k:i.k,ok:i.ok,h:i.h||0,to:i.to||0,err:i.err,a:key,lv:i.lv==null?1:i.lv}))};
  saveSession(sess);
  run.result=Object.assign({},sess,{items,unlocked:prizeNew(snap),stop:journeyNew(before),pb:pbB,rep,learn:learned('math',ls,sess.items)});S.view='results';render();
}
function guidedSubmit(val){
  const q=run.qs[run.i],st=run.st[run.i];
  if(st.done)return;
  val=String(val).trim();if(val==='')return;
  st.tries++;st.given=val;
  if(Number(val)===q.ans){st.done=true;st.ok=true;st.helped=st.tries>1||st.hint;st.msg='right';st.cheer=pick(CHEERS)}
  else{
    if(!st.err)st.err=classify(q,val);
    st.wrong.push(val);st.hint=true;
    if(st.tries>=2){st.done=true;st.ok=false;st.msg='reveal'}else st.msg='retry';
  }
  render();
}
function setAv(k,v){
  const a=getAv();
  if(k==='skin'||k==='hair'||k==='outfit')a[k]=Number(v);
  else if(k==='style')a.style=v;
  else if(k==='house'){if(HOUSES[v])a.house=v}
  else if(k==='item'){
    const it=ITEMS.find(x=>x.id===v);if(!it)return;
    if(it.slot==='extra')a.extra=a.extra.includes(v)?a.extra.filter(x=>x!==v):[...a.extra,v];
    else if(it.slot==='head')a.head=a.head===v?'':v;
    else a.top=a.top===v?'tee':v;
  }
  store.set('lmath.avatar',a);touchProfile();render();
}
document.addEventListener('input',e=>{
  if(e.target.id==='spin'&&sp&&sp.game==='test')sp.items[sp.i].val=e.target.value;
  if(e.target.id==='ans'&&run&&run.mode==='exam')run.answers[run.i]=e.target.value.replace(/[^0-9]/g,'');
  if(e.target.id==='ans')e.target.value=e.target.value.replace(/[^0-9]/g,'');
});
document.addEventListener('keydown',e=>{
  if(sp&&S.view==='sprun'&&sp.game==='scramble'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){
    const it=sp.items[sp.i];
    if(/^[a-z]$/i.test(e.key)){e.preventDefault();scrPlaceChar(it,e.key.toLowerCase());render();return}
    if(e.key==='Backspace'){e.preventDefault();scrBack(it);render();return}
  }
  if(e.key!=='Enter')return;
  if(e.target.id==='spin'&&sp){e.preventDefault();act(sp.game==='test'?'spnext':'spcheck');return}
  if(e.target.id==='esin'&&es){e.preventDefault();act(es.game==='quiz'?'esnext':'escheck');return}
  if(e.target.id==='ans'&&run){e.preventDefault();if(run.mode==='exam')act('next');else guidedSubmit(e.target.value)}
  if(e.target.id==='pin')act('unlock');
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  act(b.dataset.act,b.dataset.v,b.dataset);
});
function act(a,v,d){
  const r=run;
  if(a.slice(0,2)==='es'&&esAct(a,v))return;
  switch(a){
    case'sethome':S.home=v;store.set('lmath.home',v);S.view='home';render();break;
    case'rehome':S.view='pickhome';render();break;
    case'start':start(v);break;
    case'skill':start('guided',v);break;
    case'topic':{
      const on=S.topics.includes(v)?S.topics.filter(x=>x!==v):[...S.topics,v];
      if(on.length){S.topics=on;store.set('lmath.topics',on);touchProfile()}
      render();break}
    case'home':S.view='home';S.unlocked=false;run=null;sp=null;es=null;render();break;
    case'exit':S.view=S.from||'home';S.unlocked=false;run=null;sp=null;es=null;render();break;
    case'psub':S.psub=v;render();break;
    case'fbstart':if(v==='draft')startDraft();else startQuiz(v);break;
    case'socstudy':S.from='soc';S.view='socstudy';render();break;
    case'soctab':S.socTab=v;render();break;
    case'geostudy':S.from='geo';S.view='geostudy';render();break;
    case'georeg':S.geoReg=v;render();break;
    case'geoflip':{const o=S.geoOpen||(S.geoOpen=new Set());if(o.has(v))o.delete(v);else{o.add(v);say(STATES.find(s=>s.ab===v).cap)}render();break}
    case'fbstudy':S.from='fb';S.view='fbstudy';render();break;
    case'fbdiv':S.fbDiv=v;render();break;
    case'fbflip':{const o=S.fbOpen||(S.fbOpen=new Set());if(o.has(v))o.delete(v);else{o.add(v);say(teamById(v).name)}render();break}
    case'nqpick':nqPick(Number(v));render();break;
    case'nqnext':if(nq.i<nq.qs.length-1){nq.i++;render()}else finishQuiz();break;
    case'fdtoggle':fdToggle(v);render();break;
    case'fdcheck':fdCheck();render();break;
    case'fdnext':if(fd.i<fd.rounds.length-1){fd.i++;render()}else finishDraft();break;
    case'splist':S.splist=v;store.set('lmath.splist',v);touchProfile();render();break;
    case'sayword':say(v);break;
    case'spstart':startSpell(v);break;
    case'spagain':{
      const g=sp.game;
      if(v==='missed')startSpell('cards',shuffle(sp.result.items.filter(i=>!i.ok).map(i=>i.w)));
      else startSpell(g);
      break}
    case'sphear':{const w=sp.items[sp.i].w;say(w,sentOf(w),w);break}
    case'sphears':{const w=sp.items[sp.i].w;say(sentOf(w));break}
    case'spcover':sp.items[sp.i].phase='write';render();break;
    case'sppeek':{const it=sp.items[sp.i];it.phase='look';it.hint=true;render();break}
    case'spcheck':{
      const it=sp.items[sp.i],el=document.getElementById('spin');
      if(!it||it.done||!el)break;
      if(sp.game==='write')sentCheck(it,el.value);else spTyped(it,el.value);
      render();break}
    case'sphint':{
      const it=sp.items[sp.i];if(it.done)break;
      if(sp.game==='scramble')scrHint(it);
      else if(sp.game==='spot'){it.hint=true;if(!it.gone){const bad=it.opts.filter(o=>o!==it.w&&!it.wrong.includes(o));if(bad.length>1)it.gone=pick(bad)}}
      else it.hint=true;
      render();break}
    case'sptile':{
      const it=sp.items[sp.i];
      if(sp.game==='fill')fillTap(it,v);else scrPlace(it,Number(v));
      render();break}
    case'spslot':scrClear(sp.items[sp.i],Number(v));render();break;
    case'spopt':spotTap(sp.items[sp.i],v);render();break;
    case'spnext':{
      const it=sp.items[sp.i],el=document.getElementById('spin');
      if(sp.game==='test'&&el)it.val=el.value;
      if(sp.i<sp.items.length-1){sp.i++;render();autoSay()}else finishSpell();
      break}
    case'hclue':sp.hunt.clue=!sp.hunt.clue;S.huntClues=sp.hunt.clue;render();break;
    case'hhint':{
      const h=sp.hunt,left=h.words.filter(x=>!x.found);
      if(left.length){const w=pick(left);w.h=1;h.hintCell=w.cells[0];h.msg='Look near the gold letter.'}
      render();break}
    case'hfinish':finishSpell();break;
    case'addlist':{
      const name=document.getElementById('listName').value.trim(),msg=document.getElementById('listMsg');
      const words=[...new Set(document.getElementById('listWords').value.toLowerCase().split(/[\n,;]+/).map(x=>x.trim()).filter(x=>/^[a-z]{3,14}$/.test(x)))].slice(0,20);
      if(!name||words.length<3){msg.textContent='Add a name and at least 3 words (letters only).';break}
      store.set('lmath.lists',[...customLists(),{id:'c'+Date.now().toString(36),name,note:'Your own list',words}]);touchProfile();
      render();document.getElementById('listMsg').textContent='Added '+words.length+' words.';break}
    case'dellist':
      store.set('lmath.lists',customLists().filter(l=>l.id!==v));
      if(S.splist===v){S.splist=UNIT3[0].id;store.set('lmath.splist',S.splist)}
      touchProfile();
      render();break;
    case'revstart':startReview(v);break;
    case'calnav':S.calOff=v==='0'?0:(S.calOff||0)+Number(v);render();break;
    case'calday':S.calSel=v;render();break;
    case'addevent':{
      const dv=document.getElementById('evDate').value,title=document.getElementById('evTitle').value.replace(/[^\w#.:' !?-]/g,'').trim().slice(0,28),msg=document.getElementById('evMsg');
      if(!/^\d{4}-\d{2}-\d{2}$/.test(dv)||!title){msg.textContent='Pick a date and add a short name.';break}
      const a=getAv(),cut=keyAdd(etNow().key,-60).replace(/-/g,'');
      a.events=[...(a.events||[]).filter(e=>String(e).slice(0,8)>=cut),dv.replace(/-/g,'')+':'+title].slice(-30);
      store.set('lmath.avatar',a);touchProfile();render();document.getElementById('evMsg').textContent='Added to the calendar.';break}
    case'delevent':{const a=getAv();a.events=(a.events||[]).filter(e=>e!==v);store.set('lmath.avatar',a);touchProfile();render();break}
    case'qhear':if(r&&r.qs)say(mathSpeech(r.qs[r.i]));break;
    case'nqhear':if(nq)say(nqSpeech(nq.qs[nq.i]));break;
    case'fdhear':if(fd){const x=fd.rounds[fd.i];say('Build the '+x.div+'. Tap the 4 teams that play in it.')}break;
    case'nav':S.view=v;if(v!=='parent'){S.unlocked=false}S.pinErr=false;render();break;
    case'av':setAv(d.k,v);break;
    case'room':setRoom(d.k,v);break;
    case'roomarea':S.roomArea=v;render();break;
    case'closettab':S.closetTab=v;render();break;
    case'opengift':{const a=getAv();if(isBirthday()&&!giftOpened()){a.gifts=[...(a.gifts||[]),giftYear()].slice(-6);store.set('lmath.avatar',a);touchProfile()}render();break}
    case'wearbday':{const a=getAv();if(giftHas()){a.head='bdaycrown';if(!a.extra.includes('bdaysash'))a.extra=[...a.extra,'bdaysash'];store.set('lmath.avatar',a);touchProfile()}render();break}
    case'prizebook':S.roomArea='prizes';S.view='closet';render();break;
    case'posslot':S.posSlot=Number(v);render();break;
    case'mine':setMine(d.k,v);break;
    case'savepost':{const el=document.getElementById('posText');if(el)setMine('text',el.value);break}
    case'tab':S.tab=v;render();break;
    case'unlock':{const el=document.getElementById('pin');if(el&&el.value===String(S.settings.pin)){S.unlocked=true;S.pinErr=false}else S.pinErr=true;render();break}
    case'saveSettings':{
      const n=Number(document.getElementById('examLen').value),np=document.getElementById('newPin').value.trim();
      S.settings.examLen=n;S.settings.examTimer=document.getElementById('examTimer').value!=='off';S.settings.football=document.getElementById('fbOn').value!=='off';{const ar=document.getElementById('autoRead');if(ar)S.settings.autoRead=ar.value==='on'}if(/^\d{4,8}$/.test(np))S.settings.pin=np;
      {const bm=document.getElementById('bdM'),bd=document.getElementById('bdD');if(bm&&bd){const a=getAv();if(bm.value&&bd.value)a.bday=bm.value+bd.value;else delete a.bday;store.set('lmath.avatar',a);touchProfile()}}
      store.set('lmath.settings',S.settings);
      render();const s=document.getElementById('saved');if(s)s.textContent=np&&!/^\d{4,8}$/.test(np)?'Saved. PIN must be 4 to 8 digits, so it was not changed.':'Saved.';break}
    case'pick':
      if(r.mode==='exam'){r.answers[r.i]=v;render()}else guidedSubmit(v);break;
    case'check':{const el=document.getElementById('ans');guidedSubmit(el?el.value:'');break}
    case'hint':r.st[r.i].hint=true;render();break;
    case'prev':if(r.i>0){r.i--;render()}break;
    case'goto':r.i=Number(v);r.review=false;render();break;
    case'next':
      if(r.mode==='exam'){if(r.i<r.qs.length-1){r.i++;render()}else{r.review=true;render()}}
      else if(r.i<r.qs.length-1){r.i++;render()}else finish();
      break;
    case'begin':r.started=true;r.tickAt=Date.now();render();break;
    case'submitExam':finish();break;
  }
}
